<style>
/* Layout: one cartoon game screen centered on a dark stage, key help underneath. Single deliberate dark theme. */
:root {
  --night: #15101c;
  --panel: #241b30;
  --fire: #f8a020;
  --ink: #f6f0e8;
  --dim: #a59bb3;
  --display: "Lilita One", "Impact", system-ui, sans-serif;
  --text: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 50% 30%, #2a1f38, var(--night) 70%);
  background-color: var(--night);
  color: var(--ink);
  font-family: var(--text);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
}
#game {
  display: block;
  width: min(100%, calc((100dvh - 110px) * 1.5));
  max-width: 100%;
  height: auto;
  border-radius: 14px;
  box-shadow: 0 0 0 4px #3a2d4a, 0 24px 70px rgba(0,0,0,.75);
  touch-action: none;
}
.hint { color: var(--dim); font-size: 13px; font-weight: 700; text-align: center; line-height: 1.7; max-width: 980px; }
.hint b { color: var(--fire); font-weight: 900; }
#stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
#turn { display: none; }
body.menu #touch { visibility: hidden; }
#touch { display: none; width: 100%; max-width: 640px; justify-content: space-between; align-items: center; gap: 12px; }
#stick {
  width: 150px; height: 150px; border-radius: 50%; position: relative; flex: none; touch-action: none;
  background: radial-gradient(circle, #3a2e4e 0 40%, #2a2138 41%); box-shadow: inset 0 0 0 3px #4a3b60;
}
#knob {
  position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
  background: var(--fire); box-shadow: inset 0 -5px 0 #b8640c, 0 4px 10px rgba(0,0,0,.4); pointer-events: none;
}
.acts { display: grid; grid-template-columns: 72px 96px; grid-template-rows: 72px 72px; gap: 8px; }
.acts button {
  border: 0; border-radius: 50%; background: #2e2440; color: var(--ink); touch-action: none;
  font-family: var(--display); font-size: 16px; box-shadow: inset 0 -4px 0 #1a1424;
}
.acts button:active { background: #4a3b60; }
#bombBtn { grid-column: 2; grid-row: 1 / span 2; border-radius: 48px; background: #7a2a14; color: var(--fire); font-size: 24px; }
/* phones and tablets: controls under the game when upright, laid over its bottom corners when sideways */
@media (pointer: coarse) {
  html, body { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  body { padding-block: 6px; }
  .hint { display: none; }
  #touch { display: flex; }
  #game { width: min(100%, calc((100dvh - 250px) * 1.5)); }
  #turn { display: block; color: var(--dim); font-size: 13px; font-weight: 800; text-align: center; margin: 0; }
}
@media (pointer: coarse) and (orientation: landscape) {
  #game { width: min(100%, calc((100dvh - 18px) * 1.5)); }
  #turn { display: none; }
  #touch {
    position: absolute; left: 0; right: 0; bottom: 0; max-width: none; pointer-events: none;
    padding: 0 max(10px, env(safe-area-inset-right, 0px)) 8px max(10px, env(safe-area-inset-left, 0px)); box-sizing: border-box;
  }
  #touch > * { pointer-events: auto; opacity: .78; }
  #stick { width: 128px; height: 128px; }
  .acts { grid-template-columns: 60px 80px; grid-template-rows: 60px 60px; }
}

  <b>P</b> pause · <b>M</b> all sound · <b>N</b> music · <b>V</b> voices · <b>C</b> swear filter
</div>
<div id="touch">
  <div id="stick" aria-label="Move: drag in any direction"><div id="knob"></div></div>

</div>
<p id="turn">Turn your phone sideways for a bigger screen.</p>
</div>

// cut a line into English parts and Slavic parts, so each part can go to the right voice
function segments(text) {
  const out = []; let last = 0;
  for (const m of text.matchAll(CYR_RE)) {
    if (m.index > last) out.push({ t: text.slice(last, m.index) });
    const hit = CYR.find(c => new RegExp('^(?:' + c[0].source + ')$', 'i').test(m[0]));
    out.push({ t: m[0], cyr: hit[1], lang: hit[2] });
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push({ t: text.slice(last) });
  return out;
}

function startLevel() {
  const L = S.level, ch = S.chapter = chapterFor(L);
  [COLS, ROWS] = ch.size;
  const grid = new Uint8Array(COLS * ROWS);
  const idx = (c, r) => r * COLS + c;
  const spawns = [[1, 1], [COLS - 2, ROWS - 2]].slice(0, S.players.length);
  const nearSpawn = (c, r, d) => spawns.some(([x, y]) => Math.abs(x - c) + Math.abs(y - r) < d);
  // every chapter has its own layout; odd rows and odd columns always stay open so the whole yard can be reached
  const LR = rng(L * 131 + 17);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const edge = r === 0 || c === 0 || r === ROWS - 1 || c === COLS - 1;
    let wall = edge || (r % 2 === 0 && c % 2 === 0);
    if (!edge && wall) {
      if (ch.layout === 'open' && Math.hypot((c - COLS / 2) / (COLS * 0.27), (r - ROWS / 2) / (ROWS * 0.3)) < 1) wall = false;
      if (ch.layout === 'sparse' && LR() < 0.3) wall = false;
    }
    if (wall) grid[idx(c, r)] = WALL;
  }
  if (ch.layout === 'hlines' || ch.layout === 'vlines') { // long walls with a few gaps in them
    const hor = ch.layout === 'hlines', lines = hor ? ROWS : COLS, along = hor ? COLS : ROWS;
    for (let k = 4; k < lines - 2; k += 4) {
      const gaps = new Set();
      while (gaps.size < 3) gaps.add(1 + 2 * Math.floor(LR() * ((along - 1) / 2)));
      for (let j = 1; j < along - 1; j += 2) {
        const c = hor ? j : k, r = hor ? k : j;
        if (!gaps.has(j) && !nearSpawn(c, r, 4)) grid[idx(c, r)] = WALL;
      }
    }
  }
  const density = Math.min(0.36 + L * 0.015, 0.52), crates = [];
  for (let r = 1; r < ROWS - 1; r++) for (let c = 1; c < COLS - 1; c++) {
    if (grid[idx(c, r)] || nearSpawn(c, r, 3)) continue;
    if (Math.random() < density) { grid[idx(c, r)] = CRATE; crates.push([c, r]); }
  }
  shuffle(crates);
  const far = crates.filter(([c, r]) => !nearSpawn(c, r, 10));
  const exitAt = far.length ? far[0] : crates[0];
  const hidden = { [idx(...exitAt)]: 'exit' };
  const cycle = ['fire', 'bomb', 'speed', 'fire', 'remote', 'bomb', 'shield', 'fire', 'wall', 'bpass'];
  const loot = [cycle[(L - 1) % cycle.length], pick(['bomb', 'fire']), pick(['bomb', 'fire']), pick(['speed', 'remote', 'wall', 'bpass', 'shield']), pick(['beer', 'vodka', 'shroom', 'pills', 'energy'])];
  if (!S.twoP) loot.push(pick(['bomb', 'fire', 'speed']), pick(['remote', 'shield', 'wall', 'vodka', 'shroom']), pick(FUN_ITEMS));
  loot.push('club'); // one strip club night hidden in every yard
  crates.filter(cr => cr !== exitAt).slice(0, loot.length).forEach((cr, i) => { hidden[idx(...cr)] = loot[i]; });

  Object.assign(S, { grid, hidden, idx, exit: { c: exitAt[0], r: exitAt[1], revealed: false, open: false, cool: 0 },
    items: [], bombs: [], fires: new Map(), burning: [], enemies: [], parts: [], nukes: [], time: 600, late: false, shake: 0, flash: 0, chatT: 3,
    dropT: 30 + Math.random() * 15, newsT: 12 + Math.random() * 10, news: null, slowmo: 0, trip: 0, club: null });

  S.players.forEach((p, i) => Object.assign(p, { x: spawns[i][0], y: spawns[i][1], sx: spawns[i][0], sy: spawns[i][1], face: 'down', walk: 0,
    moving: false, inv: 2.5, alive: !p.out, deadT: 0, say: null, idle: 0, finger: 0, drunk: 0, chatT: 6 + Math.random() * 6 }));

  const n = Math.min(4 + L + Math.floor((COLS * ROWS - 247) / 60), ch.boss ? 7 : 14);
  const pool = ch.pool;
  const roster = ch.boss ? [ch.boss] : [pool[pool.length - 1]];
  while (roster.length < n) roster.push(pick(pool));
  const free = [];
  for (let r = 1; r < ROWS - 1; r++) for (let c = 1; c < COLS - 1; c++)
    if (!grid[idx(c, r)] && !nearSpawn(c, r, 7)) free.push([c, r]);
  shuffle(free);
  if (ch.boss) free.sort((a, b) => (Math.abs(b[0] - 1) + Math.abs(b[1] - 1)) - (Math.abs(a[0] - 1) + Math.abs(a[1] - 1))); // the boss waits far away
  roster.forEach((t, i) => { if (free[i]) spawnEnemy(t, free[i][0], free[i][1]); });
  S.roster = [...new Set(roster)];
  S.tip = ch.tip || pick(TIPS);
  S.story = { lines: ch.story, page: 0, t: 0, spoken: -1 };
  S.mode = 'story'; S.modeT = 0;
  buildBackground();
  cam = camGoal();
  saveProgress(); // checkpoint: Continue starts you here
}

      else if (it.type === 'viagra') { p.viagra = 12; say(p, VIAGRA_LINES, 3, true); } // +3 blast range
      else if (it.type === 'samogon') { p.samogon = 10; sfx.burp(); say(p, SAMOGON_LINES, 3, true); } // fireproof, and wobbly

      if (!S.grid[S.idx(c, r)] && !bombAt(c, r) && !S.items.some(i => i.c === c && i.r === r) && !(S.exit.revealed && S.exit.c === c && S.exit.r === r)
        && Math.abs(c - p.x) + Math.abs(r - p.y) >= 3) spots.push([c, r]);
    if (spots.length) {
      const [c, r] = pick(spots);

      for (let i = 0; i < 10; i++) { const a = i / 10 * 6.28; S.parts.push({ kind: 'star', x: c + 0.5, y: r + 0.5, vx: Math.cos(a) * 2, vy: Math.sin(a) * 2, t: 0.8, max: 0.8 }); }
      if (p.alive && !p.say && Math.random() < 0.5) say(p, FIND_LINES, 2.6);
    }
  }
  for (const n of S.nukes) {
    n.t += dt;

      S.parts.push({ kind: 'ember', x: (n.x + (Math.random() - 0.5) * T * 1.4 * n.s) / T, y: (n.y - T * 3.2 * n.s * easeOut(n.t / 1.9)) / T,
        vx: (Math.random() - 0.5) * 2, vy: -0.6 - Math.random() * 1.8, t: 1.3, max: 1.3 });
  }

  S.shake = Math.max(0, S.shake - dt * 30);
  S.flash = Math.max(0, S.flash - dt);
  const g = camGoal(), k = Math.min(1, dt * 6);
  cam.z += (g.z - cam.z) * k; cam.x += (g.x - cam.x) * k; cam.y += (g.y - cam.y) * k;
}

function moveEnemy(e, dt) {
  const def = ENEMY[e.type];
  if (e.x === e.tx && e.y === e.ty) {
    const opts = Object.keys(DIRS).filter(d => !solidEnemy(e, e.x + DIRS[d][0], e.y + DIRS[d][1]));
    if (!opts.length) { e.dir = null; e.wait = 0.3; return; }
    const fwd = opts.filter(d => d !== (e.dir && OPP[e.dir]));
    const alive = S.players.filter(p => p.alive);
    const target = alive.sort((a, b) => Math.hypot(a.x - e.x, a.y - e.y) - Math.hypot(b.x - e.x, b.y - e.y))[0];
    let choice;
    if (def.chase && target && Math.abs(target.x - e.x) + Math.abs(target.y - e.y) < 7 && Math.random() < def.chase) {
      choice = opts.slice().sort((a, b) =>
        Math.hypot(e.x + DIRS[a][0] - target.x, e.y + DIRS[a][1] - target.y) - Math.hypot(e.x + DIRS[b][0] - target.x, e.y + DIRS[b][1] - target.y))[0];
    } else if (e.dir && fwd.includes(e.dir) && Math.random() < def.straight) choice = e.dir;
    else choice = pick(fwd.length ? fwd : opts);
    e.dir = choice; e.tx = e.x + DIRS[choice][0]; e.ty = e.y + DIRS[choice][1];
    if (choice === 'left' || choice === 'right') e.face = choice;
  } else if (bombAt(e.tx, e.ty)) {
    e.tx -= DIRS[e.dir][0]; e.ty -= DIRS[e.dir][1]; e.dir = OPP[e.dir];
    if (e.dir === 'left' || e.dir === 'right') e.face = e.dir;
  }
  const step = def.speed * (S.late && e.type === 'boomer' ? 1.3 : 1) * (S.slowmo > 0 ? 0.4 : 1) * (S.chill > 0 ? 0.6 : 1) * dt;
  const dx = e.tx - e.x, dy = e.ty - e.y;
  if (Math.abs(dx) + Math.abs(dy) <= step) { e.x = e.tx; e.y = e.ty; } else { e.x += Math.sign(dx) * step; e.y += Math.sign(dy) * step; }
}

function drawFires() {

    const k = f.t / FIRE_T, s = Math.min(1, (1 - k) * 8) * Math.min(1, k * 2.4);

}

const HEAT = [[0, [255, 250, 215]], [0.5, [255, 185, 70]], [1.2, [235, 95, 35]], [2.0, [125, 75, 60]], [3.0, [90, 84, 94]]];

function drawMushrooms() {

      puff(n.x + Math.cos(a) * capR * 0.85, capY + capR * 0.15 + Math.sin(a) * capR * 0.3, capR * 0.42 * p.r * (1 + wob(i)), t + 0.1 * p.o, 0.22);

function draw() {

  if (S.mode === 'title') drawTitle(); else drawGame();
  if (overlay) drawOverlay();

}
function drawGame() {
  C.fillStyle = '#15101c'; C.fillRect(0, 0, W, H);
  const drunk = S.players.some(p => p.alive && (p.drunk > 0 || p.vodka > 0 || p.samogon > 0));
  const wired = S.players.some(p => p.alive && p.boost > 0);
  // earthquake after a nuke: a rolling shake that fades out
  const q = S.quake > 0 ? Math.min(1, S.quake) * (S.quakeAmp || 0) : 0, tq = now();
  const sx = (Math.random() - 0.5) * (S.shake + (wired ? 3 : 0)) + (drunk ? Math.sin(tq * 2.3) * 12 : 0) + Math.sin(tq * 38) * q;
  const sy = (Math.random() - 0.5) * (S.shake + (wired ? 3 : 0)) + (drunk ? Math.sin(tq * 3.1) * 7 : 0) + Math.cos(tq * 31) * q * 0.7;
  C.save();
  C.beginPath(); C.rect(0, HUD, W, VH); C.clip();
  C.translate(sx, HUD + sy);
  if (q) { C.translate(VW / 2, VH / 2); C.rotate(Math.sin(tq * 23) * 0.0035 * q); C.translate(-VW / 2, -VH / 2); }
  if (S.trip > 0) C.filter = `hue-rotate(${(tq * 140) % 360}deg) saturate(1.9)`;
  if (S.acid > 0) { // acid: rainbow colours, breathing walls
    C.filter = `hue-rotate(${(tq * 260) % 360}deg) saturate(2.6) contrast(1.2)`;
    const z = 1 + Math.sin(tq * 3) * 0.03;
    C.translate(VW / 2, VH / 2); C.scale(z, 2 - z); C.rotate(Math.sin(tq * 1.9) * 0.03); C.translate(-VW / 2, -VH / 2);
  }
  if (drunk) { C.translate(VW / 2, VH / 2); C.rotate(Math.sin(now() * 1.7) * 0.025); C.translate(-VW / 2, -VH / 2); }
  C.scale(cam.z, cam.z); C.translate(-cam.x, -cam.y);
  C.drawImage(bg, 0, 0);
  if (S.exit.revealed) drawToilet();
  S.items.forEach(drawItem);
  const c0 = Math.max(0, Math.floor(cam.x / T) - 1), c1 = Math.min(COLS, Math.ceil((cam.x + VW / cam.z) / T) + 1);
  const r0 = Math.max(0, Math.floor(cam.y / T) - 1), r1 = Math.min(ROWS, Math.ceil((cam.y + VH / cam.z) / T) + 2);
  for (let r = r0; r < r1; r++) for (let c = c0; c < c1; c++) if (S.grid[S.idx(c, r)] === CRATE) {
    const img = crateImgs[(c * 7 + r * 13) % crateImgs.length], b = S.burning.find(x => x.c === c && x.r === r);
    if (b) {
      C.save(); C.globalAlpha = b.t / 0.5; C.translate(c * T + T / 2, r * T + T / 2); C.scale(1 + (0.5 - b.t) * 0.4, 1 + (0.5 - b.t) * 0.4);
      C.drawImage(img, -T / 2, -T / 2 - 12); C.globalCompositeOperation = 'lighter'; C.fillStyle = 'rgba(255,140,40,.6)'; C.fillRect(-T / 2, -T / 2 - 12, T, T + 12); C.restore();
    } else C.drawImage(img, c * T, r * T - 12);
  }
  drawShockwaves();
  drawMushrooms(); // under the bombs and characters, so the action stays visible through the cloud
  S.bombs.forEach(drawBomb);
  drawClub();
  const actors = [...S.enemies.map(e => ({ y: e.y, e })), ...S.players.filter(p => !p.out).map(p => ({ y: p.y, p }))].sort((a, b) => a.y - b.y);
  for (const a of actors) {
    if (a.e) { drawEnemy(a.e); continue; }
    const p = a.p;
    if (p.alive && p.inv > 0 && S.mode === 'play' && Math.floor(now() * 14) % 2) continue;
    if (p.alive && S.grid[S.idx(Math.round(p.x), Math.round(p.y))] === CRATE) C.globalAlpha = 0.6;
    drawGuy(p, p.x * T + T / 2, p.y * T + T / 2, p.pill ? { giant: 1.6, tiny: 0.55, turbo: 1 }[p.pill.kind] : 1);
    C.globalAlpha = 1;
  }
  if (S.club) for (const e of S.enemies) if (e.alive) { // love-struck: a heart bobbing over every frozen enemy
    const hx = e.x * T + T / 2, hy = e.y * T - 8 + Math.sin(now() * 5 + e.phase) * 4;
    circ(hx - 4, hy, 5); C.fillStyle = '#ff3a8a'; C.fill(); circ(hx + 4, hy, 5); C.fill();
    C.beginPath(); C.moveTo(hx - 9, hy + 1); C.lineTo(hx, hy + 11); C.lineTo(hx + 9, hy + 1); C.closePath(); C.fill();
  }
  drawFires();
  drawParts();
  C.restore();

  // vignette and overlays in screen space
  C.fillStyle = rad(W / 2, HUD + VH / 2, VH * 0.45, VH * 0.95, [[0, 'rgba(0,0,0,0)'], [1, S.late ? 'rgba(90,0,20,.5)' : 'rgba(0,0,0,.35)']]);
  C.fillRect(0, HUD, W, VH);
  if (S.flash > 0) { C.fillStyle = `rgba(255,240,200,${S.flash * 2.5})`; C.fillRect(0, HUD, W, VH); }
  const toScreen = (x, y, lift) => [(x * T + T / 2 - cam.x) * cam.z + sx, (y * T + T / 2 - cam.y - lift) * cam.z + HUD + sy];
  if (S.slowmo > 0) { C.fillStyle = 'rgba(120,40,160,.16)'; C.fillRect(0, HUD, W, VH); }
  if (S.club) { // disco lights sweeping the yard
    C.save(); C.globalCompositeOperation = 'lighter';
    [['255,60,180', 0], ['80,140,255', 2.1], ['255,220,60', 4.2]].forEach(([rgb, o]) => {
      const lx = W / 2 + Math.cos(now() * 1.3 + o) * W * 0.35, ly = HUD + VH / 2 + Math.sin(now() * 1.7 + o) * VH * 0.3;
      circ(lx, ly, 220); C.fillStyle = rad(lx, ly, 10, 220, [[0, `rgba(${rgb},.16)`], [1, `rgba(${rgb},0)`]]); C.fill();
    });
    C.restore();
  }
  if (S.chill > 0) { // drifting green haze
    C.fillStyle = `rgba(150,200,120,${0.14 + Math.sin(now() * 1.3) * 0.05})`; C.fillRect(0, HUD, W, VH);
  }
  if (S.news) { // breaking-news ticker scrolling across the top of the yard, under the speech bubbles
    const k = 1 - S.news.t / 9, y = HUD + 8, msg = clean(S.news.text);
    C.fillStyle = 'rgba(20,10,24,.85)'; C.fillRect(0, y, W, 34);
    C.save(); C.beginPath(); C.rect(170, y, W - 170, 34); C.clip();
    C.font = `900 18px ${TXT}`; const mw = C.measureText(msg).width;
    txt(msg, W - k * (W - 170 + mw + 40), y + 18, 18, '#fff', 'left');
    C.restore();
    rrp(8, y + 4, 154, 26, 6); C.fillStyle = '#d0202a'; C.fill(); txt('BREAKING NEWS', 85, y + 18, 15, '#fff', 'center', DISP, 400);
  }
  for (const n of S.nukes) if (n.say && n.topY !== undefined) bubble(n.say.text, (n.x - cam.x) * cam.z + sx, (n.topY - cam.y) * cam.z + HUD + sy);
  for (const b of S.bombs) if (b.say && onScreen(b.c, b.r)) { const [bx, by] = toScreen(b.c, b.r, 30); bubble(b.say.text, bx, by); }
  for (const e of S.enemies) if (e.alive && ENEMY[e.type].boss) { // boss health
    const def = ENEMY[e.type];
    rrp(W / 2 - 200, HUD + 12, 400, 30, 15); C.fillStyle = 'rgba(20,10,24,.85)'; C.fill(); C.strokeStyle = '#f8a020'; C.lineWidth = 3; C.stroke();
    rrp(W / 2 - 194, HUD + 18, 388 * e.hp / def.hp, 18, 9); C.fillStyle = '#d02a5a'; C.fill();
    txt(def.name.toUpperCase(), W / 2, HUD + 28, 16, '#fff', 'center', DISP, 400, true);
  }
  for (const e of S.enemies) if (e.say && onScreen(e.x, e.y)) { const [bx, by] = toScreen(e.x, e.y, ENEMY[e.type].boss ? 70 : 34); bubble(e.say.text, bx, by); }
  for (const p of S.players) if (p.say && !p.out) { const [bx, by] = toScreen(p.x, p.y, p.finger > 0 ? 60 : 46); bubble(p.say.text, bx, by); }
  drawHUD();

  const cx = W / 2;
  if (S.mode === 'story') drawStory();
  else if (S.mode === 'intro') {
    const y = panel(820, 360), ch = S.chapter;
    txt(ch.bonus ? ch.title : `CHAPTER ${S.level} OF ${CHAPTERS.length}`, cx, y + 42, 20, '#a59bb3', 'center', DISP, 400);
    txt(ch.bonus ? placeName(ch).toUpperCase() : ch.title, cx, y + 98, 58, '#f8a020', 'center', DISP, 400, true);
    if (!ch.bonus) txt(placeName(ch), cx, y + 148, 24, '#f6f0e8', 'center', DISP, 400);
    txt("TONIGHT'S IDIOTS", cx, y + 192, 16, '#a59bb3');
    txt(S.roster.map(t => ENEMY[t].name).join('  ·  '), cx, y + 222, 21, '#f6f0e8');
    txt(clean(S.tip), cx, y + 270, 19, '#cfc6dc');
    txt(S.level === CHAPTERS.length ? 'Kevin is here. Get him back.' : 'Find the toilet. Maybe it is Kevin.', cx, y + 318, 20, '#6fd0ff', 'center', DISP, 400);
  } else if (S.mode === 'pause') { // pause menu: the game is saved the moment you pause
    const y = panel(620, 560);
    txt('PAUSED', cx, y + 62, 60, '#f8a020', 'center', DISP, 400, true);
    txt(clean("Go take a piss, I'll wait."), cx, y + 112, 19, '#f6f0e8');
    txt(`Saved. Continue starts you at the beginning of yard ${S.level}.`, cx, y + 140, 15, '#a59bb3');
    buttons = [];
    [['RESUME', togglePause], ['HOW TO PLAY', () => openOverlay('guide')], ['SETTINGS', () => openOverlay('settings')],
      ['SAVE GAME', saveNow], ['SAVE & QUIT TO MENU', quitToTitle]]
      .forEach(([label, act], i) => menuBtn(label, cx, y + 200 + i * 72, 380, 56, act, i === 0));
  } else if (S.mode === 'clear' && S.modeT > 1.2) {
    const y = panel(640, 230);
    txt(S.level === CHAPTERS.length ? 'KEVIN IS SAFE!' : 'YARD CLEARED', cx, y + 75, 62, '#6fd0ff', 'center', DISP, 400, true);
    txt(`${S.clearBy.col.name} TOOK A VICTORY DUMP`, cx, y + 140, 22, '#f6f0e8');
    txt('TIME BONUS +' + S.bonus, cx, y + 182, 24, '#f8a020', 'center', DISP, 400);
  } else if (S.mode === 'over') {
    const y = panel(640, 380);
    txt('YOU BLEW IT', cx, y + 75, 70, '#ff5030', 'center', DISP, 400, true);
    txt('(literally)', cx, y + 125, 20, '#a59bb3');
    S.players.forEach((p, i) => txt(`${p.col.name}   ${p.score}`, cx, y + 175 + i * 36, 28, p.col.hair, 'center', DISP, 400, true));
    txt('REACHED YARD ' + S.level + '   ·   BEST ' + best, cx, y + 270, 20, '#f6f0e8');
    if (S.modeT > 1 && Math.floor(now() * 2) % 2) txt(clean(`${TOUCH ? 'Tap' : 'Press Enter'} to try again, champ.`), cx, y + 330, 22, '#f8a020', 'center', DISP, 400);
  }
}

let last = performance.now();
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (overlay || S.mode === 'title' || S.mode === 'over' || S.mode === 'pause') S.modeT += dt; else update(dt);
  if (toast && (toast.t -= dt) <= 0) toast = null;
  draw();
  requestAnimationFrame(loop);
}
// build-time only (voice/build.py): every line the game can speak, per voice, so each one can be recorded once.
// Lines with {slots} are filled a few fixed ways; with a voice pack loaded, pickLine only uses those recorded fills.
window.__fuseVoiceScript = () => {
  const items = [], variants = {}, seen = new Set();
  const flat = v => (Array.isArray(v) ? v : Object.values(v)).flat(Infinity);
  const add = (group, list, k) => flat(list).forEach(s => {
    if (typeof s !== 'string' || s.startsWith('*')) return;
    let texts = [s];
    if (/\{\w+\}/.test(s)) {
      if (!variants[s]) { const set = new Set(); for (let i = 0; i < 20 && set.size < k; i++) set.add(fillLine(s)); variants[s] = [...set]; }
      texts = variants[s];
    }
    for (const text of texts) { const key = group + '|' + text; if (!seen.has(key)) { seen.add(key); items.push({ g: group, text, seg: segments(text) }); } }
  });
  const garyLists = Object.entries(LINES).filter(([k]) => k !== 'gloat' && k !== 'late').map(([, v]) => v);
  add('gary', [garyLists, KEVIN_FOUND, KEVIN_OPEN, PERV_LINES, MEGA_LINES, VODKA_LINES, VODKA_CHAT, SHROOM_LINES, PILL_LINES, ENERGY_LINES, GAS_LINES,
    SYRUP_LINES, SALO_LINES, BEANS_LINES, FIND_LINES, JOINT_LINES, NEEDLE_LINES, ACID_LINES, HORSE_LINES, POWDER_LINES, VIAGRA_LINES, SAMOGON_LINES, CLUB_LINES,
    ['Aaand it wore off. {r}.', 'Back to normal. Boring.', 'What did I just take?', 'Eyes on me, {i}!', 'No touching the dancers!', 'Bouncer Gary says GET OUT!',
     'Heh heh. Too distracted, {i}!', 'Fireproof undies ON, bitches!', 'Testing, testing. Can you hear me, dumbass?']], 3);
  for (const type of Object.keys(ENEMY)) add(type, [ENEMY[type].lines, ENEMY[type].death], 2);
  const shared = [ENEMY_TAUNTS, GENERIC_DEATH, SMITTEN, ['Worth it...', 'Totally worth it.', 'I died happy.', 'Tell her I loved her!']];
  add('enemyM', shared, 2); add('enemyF', shared, 2);
  add('general', [['ARGH! My medals!', 'You will pay for that, Gary!', 'Soldiers! HELP ME!', 'That tickles, capitalist!', 'My beautiful beet face!', '{r}! Get him!'],
    ['Soldiers! Attack!', 'More soldiers! We have plenty!', 'Send in the conscripts!']], 2);
  add('bomb', BOMB_LINES, 2); add('nuke', NUKE_YELLS, 2); add('boomer', ['GET OFF MY LAWN!'], 1);
  const walk = v => { if (Array.isArray(v)) { if (v.length === 2 && typeof v[0] === 'string' && typeof v[1] === 'string' && /^[a-z]+$/.test(v[0])) add(v[0], [v[1]], 1); else v.forEach(walk); } else if (v && typeof v === 'object') Object.values(v).forEach(walk); };
  walk(CHAPTERS); walk(ENDING);
  return { items, variants, curses: RUS.map(w => ({ word: w, seg: segments(w) })) };
};
const go = () => { makeCrates(); buildTitleBg(); requestAnimationFrame(t => { last = t; loop(t); }); };
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load(`900 16px ${TXT}`), document.fonts.load(`40px ${DISP}`)]).then(go, go); else go();
})();
</script>
