<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Suffler"><meta name="theme-color" content="#130a1b"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>Suffler</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Old+Standard+TT:ital@0;1&family=Cormorant+SC:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: scripts library → script editor → camera with text on top → take. Night look from Quiet Moon, single dark theme by choice. */
:root{
  --bg:#130a1b; --panel:#241532; --panel2:#331f45; --line:#523666; --mist:#8e6fb0; --fg:#f8ecf3; --muted:#c7aabd;
  --rose:#f3a6c4; --blush:#ffd9e8; --gold:#f0c97a; --ink:#130a1b; --rec:#ff8a6b;
  --f:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Cormorant Garamond",Georgia,serif; --disp:"Old Standard TT",Georgia,serif; --sc:"Cormorant SC",Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;font-variant-numeric:lining-nums}
*{box-sizing:border-box}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg)}
@media (min-width:600px){.app{height:min(100%,900px);border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.page{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(18px,calc(env(safe-area-inset-top,0px) + 8px)) max(16px,env(safe-area-inset-right,0px)) max(24px,calc(env(safe-area-inset-bottom,0px) + 12px)) max(16px,env(safe-area-inset-left,0px))}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.sc{font-family:var(--sc);font-weight:700;letter-spacing:.2em;color:var(--gold)}
.iconbtn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:0}
.iconbtn svg{width:22px;height:22px}

/* screen 1: scripts library */
#home{overflow-y:auto;gap:0}
.sky{position:absolute;top:0;left:0;width:100%;height:240px;pointer-events:none}
.hello{position:relative;display:flex;flex-direction:column;gap:6px;padding:28px 8px 0}
.hello .top{display:flex;align-items:center;gap:10px}
.hello .top .sc{font-size:13px}
.ver{font-size:12px;color:var(--muted);font-weight:600;margin-right:auto}
.hello h1{margin:0;font-family:var(--disp);font-weight:400;font-size:34px;line-height:1.15}
.hello p{margin:0;font-family:var(--serif);font-style:italic;font-size:20px;color:var(--muted)}
.acts{position:relative;display:flex;gap:12px;padding:24px 8px 0}
.new{flex:1;min-height:56px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--rose);color:var(--ink);border:0;border-radius:18px;font-weight:800;font-size:16px}
.new svg{width:20px;height:20px}
.quick{width:56px;height:56px;border-radius:18px}
.listhead{display:flex;justify-content:space-between;align-items:baseline;padding:28px 8px 10px}
.listhead h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.14em}
.listhead span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px;padding:0 8px 8px}
.card{display:flex;flex-direction:column;gap:8px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:20px;text-align:left;width:100%}
.card:active{background:var(--panel2)}
.card .t{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card .t b{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid var(--mist)}
.badge.ready{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.card .p{font-size:14px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:12px;color:var(--muted)}
.empty{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--muted);text-align:center;padding:30px 10px}

/* screen 2: script editor */
#write{gap:10px}
.bar{display:flex;align-items:center;gap:10px}
.bar .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#title{width:100%;background:none;border:0;border-bottom:1px solid transparent;padding:2px 0;font-family:var(--serif);font-weight:600;font-size:22px;color:var(--fg)}
#title:focus{outline:none;border-bottom-color:var(--gold)}
#title::placeholder{color:var(--mist)}
.info{color:var(--muted);font-size:12.5px;display:flex;gap:10px}
.pill{border:0;border-radius:999px;background:var(--rose);color:var(--ink);font-weight:800;font-size:15px;padding:0 18px;height:44px;display:flex;align-items:center;gap:8px}
.pill svg{width:18px;height:18px}
.pill:disabled{opacity:.4;cursor:not-allowed}
textarea#text{flex:1;width:100%;min-height:0;resize:none;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;font-family:var(--serif);font-size:21px;font-weight:500;line-height:1.5}
textarea#text:focus{outline:none;border-color:var(--gold)}
textarea#text::placeholder{color:var(--mist);font-style:italic}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.link{background:none;border:0;padding:8px 4px;font-size:14px;font-weight:700;color:var(--muted)}
.link.warn{color:var(--rec)}
.helper{background:var(--panel);border:1px solid var(--gold);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;max-height:42%;min-height:0}
.helper .hh{display:flex;align-items:center;gap:8px}
.helper .hh svg{width:18px;height:18px;flex:none}
.helper .hh .sc{font-size:13px;letter-spacing:.16em}
.helper .hh small{flex:1;font-size:12px;color:var(--muted)}
.helper .hh button{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
.helper .say{margin:0;font-family:var(--serif);font-size:19px;line-height:1.4;white-space:pre-wrap;overflow-y:auto;min-height:0}
.helper .say.wait{font-style:italic;color:var(--muted)}
.helper .hb{display:flex;gap:8px}
.helper .hb button{flex:1;border-radius:14px;padding:10px;font-weight:800;font-size:14px;border:1px solid var(--line);background:var(--panel2)}
.helper .hb .use{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.kbox{display:flex;flex-direction:column;gap:8px}
.kbox .hint{white-space:pre-line}
.klink{color:var(--gold);font-weight:700;font-size:14px}
.kbox textarea{width:100%;resize:none;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:15px}
.kbox textarea:focus{outline:none;border-color:var(--gold)}
.hmore{display:flex;justify-content:space-between;margin:-4px -4px -6px}
.hmore .link{font-size:13px;padding:6px 4px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:700;color:var(--blush)}
.chips button:disabled,.askrow button:disabled{opacity:.45}
.askrow{display:flex;gap:8px;align-items:center}
.askrow input{flex:1;min-width:0;height:48px;border-radius:16px;border:1px solid var(--line);background:var(--panel);padding:0 16px;font-size:15px}
.askrow input:focus{outline:none;border-color:var(--gold)}
.askrow input::placeholder{color:var(--mist)}
.askrow button{width:48px;height:48px;flex:none;border-radius:16px;border:0;background:var(--gold);display:grid;place-items:center;padding:0}
.askrow button svg{width:20px;height:20px}

/* screen 3: camera */
#shoot{position:absolute;inset:0;background:#000}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cam.mirror{transform:scaleX(-1)}
.nocam{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 80%,#3a2350,#1c1026 45%,#0b0610);display:flex;align-items:flex-end;justify-content:center;padding:0 24px 150px;color:var(--muted);font-size:13px;text-align:center}
.textbox{position:absolute;left:0;right:0;top:0;height:var(--th,42%);overflow:hidden;background:rgba(19,10,27,.58);-webkit-mask:linear-gradient(#000 75%,transparent);mask:linear-gradient(#000 75%,transparent);padding-top:max(6px,env(safe-area-inset-top,0px))}
.textbox::before{content:'';position:absolute;left:50%;top:max(4px,env(safe-area-inset-top,0px));transform:translateX(-50%);width:34px;height:3px;border-radius:2px;background:var(--gold);opacity:.7}
.words{max-width:min(100%,30em);margin:0 auto;padding:0 18px 70%;font-size:var(--ts,32px);line-height:1.3;font-weight:800;color:#fff;will-change:transform;transform:translateZ(0);backface-visibility:hidden}
.words span{transition:color .5s ease}
.words span.done{color:rgba(255,255,255,.35)}
.words span.next{color:var(--gold)}
.timerwrap{position:absolute;left:0;right:0;bottom:max(158px,calc(env(safe-area-inset-bottom,0px) + 146px));z-index:3;display:flex;justify-content:center;pointer-events:none}
.glass{background:rgba(19,10,27,.6);border:1px solid rgba(255,217,232,.18);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.round svg{width:20px;height:20px}
.timer{font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;padding:8px 12px;border-radius:999px;display:flex;align-items:center;gap:7px}
.timer i{width:9px;height:9px;border-radius:50%;background:#777}
.meter{width:42px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;display:none}.meter u{display:block;height:100%;width:0;background:var(--gold);transition:width .08s}.timer.on .meter{display:block}
.timer.on i{background:var(--rec);animation:b 1s infinite}
@keyframes b{50%{opacity:.25}}
.status{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--th,42%) + 6px);z-index:3;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.heard{position:absolute;left:16px;right:16px;bottom:max(202px,calc(env(safe-area-inset-bottom,0px) + 190px));z-index:3;text-align:center;font-size:14px;color:rgba(255,255,255,.85);text-shadow:0 1px 6px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;justify-content:space-evenly;padding:16px 16px max(64px,calc(env(safe-area-inset-bottom,0px) + 52px));background:linear-gradient(transparent,rgba(19,10,27,.7))}
.rec{width:78px;height:78px;border-radius:50%;border:4px solid var(--blush);background:none;display:grid;place-items:center;padding:0}
.rec i{width:60px;height:60px;border-radius:50%;background:var(--rec);transition:all .2s}
.rec.on i{width:28px;height:28px;border-radius:7px}
.mode{height:42px;min-width:84px;border-radius:999px;font-size:13px;font-weight:800;padding:0 14px}
.count{position:absolute;inset:0;z-index:5;display:grid;place-items:center;font-family:var(--disp);font-size:130px;color:var(--blush);text-shadow:0 6px 40px rgba(0,0,0,.6);pointer-events:none}
.panel{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 20px max(24px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:700}
.row span{flex:1}
.row input{width:50%;accent-color:var(--rose)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:16px;padding:12px;font-weight:800}
.btn.main{background:var(--rose);color:var(--ink);border-color:var(--rose)}
.btn:disabled{opacity:.5}
/* take editor */
.studio{position:absolute;inset:0;z-index:7;background:var(--bg);display:flex;flex-direction:column;gap:10px;padding:max(14px,calc(env(safe-area-inset-top,0px) + 6px)) max(16px,env(safe-area-inset-right,0px)) max(18px,calc(env(safe-area-inset-bottom,0px) + 8px)) max(16px,env(safe-area-inset-left,0px))}
.studio .ttl{flex:1;font-family:var(--serif);font-weight:600;font-size:22px}
.stage{flex:1;min-height:120px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.frame{position:relative;overflow:hidden;border-radius:18px;background:#000;cursor:pointer;--fw:300px}
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tint{position:absolute;inset:0;pointer-events:none}
.cap{position:absolute;left:6%;right:6%;bottom:16%;text-align:center;pointer-events:none;font-weight:800;font-size:calc(var(--fw) * .055);line-height:1.35;color:#fff}
.cap span{background:rgba(19,10,27,.62);padding:.05em .35em;border-radius:.3em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.pp{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(19,10,27,.55);border:1px solid rgba(255,217,232,.3);display:grid;place-items:center;pointer-events:none;transition:opacity .2s}
.pp svg{width:24px;height:24px;margin-left:3px}
.frame.playing .pp{opacity:0}
.scrub{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.scrub input{flex:1;accent-color:var(--rose)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-width:58px;border:0;background:none;border-radius:14px;padding:7px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.tabs button svg{width:20px;height:20px}
.tabs button.on{background:var(--panel2);color:var(--gold)}
.tool{display:flex;flex-direction:column;gap:8px;min-height:44px;justify-content:center}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button,.optbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 14px;font-size:13.5px;font-weight:700;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opts .on{background:var(--rose);color:var(--ink);border-color:var(--rose)}
.row.sw input{width:auto;width:22px;height:22px}
.note{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:13.5px;color:var(--blush)}
.note svg{width:18px;height:18px;flex:none}
.studio.empty .stage,.studio.empty .scrub,.studio.empty .note,.studio.empty #save,.studio.empty .edit{display:none}
@media (max-height:700px){.note{display:none}}
.edit{display:flex;flex-direction:column;gap:8px}.edit .row{font-size:13.5px}.edit .row input{width:46%}.edit output{font-size:12px;color:var(--muted);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:13px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <!-- 1. scripts library -->
  <section id="home" class="page">
    <svg class="sky" aria-hidden="true" viewBox="0 0 390 240" preserveAspectRatio="xMidYMin slice">
      <circle cx="40" cy="60" r="1.2" fill="#f0c97a"/><circle cx="120" cy="30" r="1" fill="#ffd9e8"/><circle cx="210" cy="80" r="1.4" fill="#f0c97a"/><circle cx="300" cy="110" r="1" fill="#ffd9e8"/><circle cx="350" cy="150" r="1.2" fill="#f0c97a"/><circle cx="80" cy="150" r=".9" fill="#ffd9e8"/><circle cx="260" cy="170" r="1" fill="#f0c97a"/>
      <path d="M330 98a26 26 0 1 1-20-34 20 20 0 1 0 20 34z" fill="#f0c97a" opacity=".9"/>
    </svg>
    <div class="hello">
      <div class="top"><span class="sc">SUFFLER</span><span class="ver">v18</span><button class="chip" id="lang">EN</button></div>
      <h1 id="greet"></h1>
      <p data-t="ask"></p>
    </div>
    <div class="acts">
      <button class="new" id="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-t="newScript"></span></button>
      <button class="iconbtn quick" id="quick" data-ta="quick"><svg viewBox="0 0 24 24" fill="none" stroke="#f3a6c4" stroke-width="2"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3" fill="#f3a6c4"/></svg></button>
    </div>
    <div class="listhead"><h2 class="sc" data-t="yours"></h2><span id="count2"></span></div>
    <div class="list" id="list"></div>
  </section>

  <!-- 2. script editor -->
  <section id="write" class="page" hidden>
    <div class="bar">
      <button class="iconbtn" id="toHome" data-ta="scripts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="mid"><input id="title" data-tp="untitled" autocomplete="off" aria-label="Title"><div class="info" id="info"></div></div>
      <button class="pill" id="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg><span data-t="record"></span></button>
    </div>
    <textarea id="text" data-tp="ph" aria-label="Text"></textarea>
    <div class="helper" id="helper" hidden aria-live="polite">
      <div class="hh"><svg viewBox="0 0 24 24" fill="none" stroke="#f0c97a" stroke-width="1.8" stroke-linecap="round"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4z"/></svg><span class="sc">MOON HELPER</span><small id="hFor"></small><button id="hClose" data-ta="close">×</button></div>
      <p class="say" id="hSay"></p>
      <div class="kbox" id="hKey" hidden>
        <p class="hint" data-t="keyHow"></p>
        <a class="klink" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" data-t="keyLink"></a>
        <form class="askrow" id="keyForm"><input id="keyIn" data-tp="keyPh" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Gemini key"><button data-ta="ok"><svg viewBox="0 0 24 24" fill="none" stroke="#130a1b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></button></form>
      </div>
      <div class="kbox" id="hGpt" hidden>
        <textarea id="gptIn" rows="3" data-tp="gptPh"></textarea>
        <div class="hb"><button id="gptPaste" data-t="paste"></button><button class="use" id="gptUse" data-t="use"></button></div>
      </div>
      <div class="hb" id="hBtns"><button class="use" id="hUse" data-t="use"></button><button id="hAgain" data-t="another"></button></div>
      <div class="hmore" id="hMore"><button class="link" id="hGptBtn" data-t="gptBtn"></button><button class="link" id="hKeyBtn" data-t="keyBtn"></button></div>
    </div>
    <div class="chips" id="chips">
      <button data-task="hook" data-t="cHook"></button><button data-task="shorter" data-t="cShorter"></button><button data-task="warmer" data-t="cWarmer"></button><button data-task="translate" id="cTrans"></button><button data-task="fix" data-t="cFix"></button>
    </div>
    <form class="askrow" id="askForm"><input id="ask" data-tp="askPh" autocomplete="off" enterkeyhint="send" aria-label="Ask the Moon helper"><button id="askGo" data-ta="send"><svg viewBox="0 0 24 24" fill="none" stroke="#130a1b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></form>
    <div class="foot"><button class="link warn" id="del" data-t="del"></button><button class="link" id="undo" data-t="undo" hidden></button><span class="info" id="takes"></span></div>
  </section>

  <!-- 3. camera + text -->
  <section id="shoot" hidden>
    <video id="cam" playsinline muted hidden></video>
    <div class="nocam" id="nocam"><span data-t="nocam"></span></div>
    <div class="textbox" id="box"><div class="words" id="words"></div></div>

<script>
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- settings ---------- */
const S=Object.assign({ui:'en',size:30,speed:160,height:30,mode:'voice',facing:'user',autovol:true,boost:0},store.get('sf.settings',{}));
if(S.height===42)S.height=30;if(S.speed===120)S.speed=160;
const save=()=>store.set('sf.settings',S);

/* ---------- words ---------- */
const T={
 en:{title:'Text',ph:'Paste the text she will read here…',start:'Open camera',words:'words',min:'about',back:'Back',settings:'Settings',flip:'Switch camera',rec:'Record',size:'Text size',speed:'Scroll speed',height:'Text area',ok:'Done',voice:'🎙 Voice',auto:'↓ Auto',
  nocam:'No camera here. Open this file in Chrome on your computer to use the camera.',noMic:'Mic not available · text scrolls automatically',micErr:'Voice recognition not allowed · switched to auto scroll',reconnect:'Voice reconnecting · scrolling at your pace',vtest:'Test voice',autovol:'Auto volume',boost:'Volume boost',eVol:'Volume',eNoise:'Remove hiss',eClear:'Voice clarity',eStart:'Cut start',eEnd:'Cut end',rendering:'Saving with your changes…',renderFail:'Could not apply changes here, saved the original.',vtestListen:'Speak now… (10 s)',vtestNone:'Heard nothing.',vtestNo:'This browser has no voice recognition.',listening:'Listening…',paused:'Paused · tap the text to continue',
  save:'Save video',again:'Record again',savedHint:'Saved to your Downloads folder.',noVideo:'No camera, so nothing was recorded. This was a practice run.',
  sample:'Hi! Today I want to show you three simple habits that changed my mornings.\n\nThe first one is a glass of water right after waking up. It sounds obvious, but it wakes me up faster than coffee.\n\nThe second is five minutes without my phone. I sit by the window and think about what matters today.\n\nAnd the third is writing down one thing I will do before lunch. Just one.\n\nTell me in the comments which habit you like most, and subscribe for the next video!'},
 uk:{title:'Текст',ph:'Встав сюди текст, який будеш читати…',start:'Відкрити камеру',words:'слів',min:'приблизно',back:'Назад',settings:'Налаштування',flip:'Змінити камеру',rec:'Запис',size:'Розмір тексту',speed:'Швидкість прокрутки',height:'Висота тексту',ok:'Готово',voice:'🎙 Голос',auto:'↓ Авто',
  nocam:'Камера тут недоступна. Відкрий цей файл у Chrome на комп’ютері.',noMic:'Мікрофон недоступний · текст прокручується сам',micErr:'Розпізнавання голосу заборонено · увімкнено автопрокрутку',reconnect:'Голос перепідключається · прокручую у твоєму темпі',vtest:'Перевірити голос',autovol:'Автогучність',boost:'Підсилення гучності',eVol:'Гучність',eNoise:'Прибрати шум',eClear:'Чіткість голосу',eStart:'Обрізати початок',eEnd:'Обрізати кінець',rendering:'Зберігаю зі змінами…',renderFail:'Не вдалося застосувати зміни, збережено оригінал.',vtestListen:'Говори… (10 с)',vtestNone:'Нічого не почуто.',vtestNo:'Цей браузер не розпізнає голос.',listening:'Слухаю…',paused:'Пауза · торкнись тексту, щоб продовжити',
  save:'Зберегти відео',again:'Записати ще раз',savedHint:'Збережено в папку «Завантаження».',noVideo:'Камери немає, тому нічого не записано. Це була репетиція.',
  sample:'Привіт! Сьогодні я покажу вам три прості звички, які змінили мій ранок.\n\nПерша — склянка води одразу після пробудження. Звучить банально, але вона будить мене швидше за каву.\n\nДруга — п’ять хвилин без телефону. Я сиджу біля вікна і думаю, що для мене важливо сьогодні.\n\nА третя — записати одну річ, яку я зроблю до обіду. Тільки одну.\n\nНапишіть у коментарях, яка звичка вам подобається найбільше, і підписуйтесь!'}
};
Object.assign(T.en,{ph:'Write or paste what you will say…',morning:'Good morning',day:'Good afternoon',evening:'Good evening',ask:'What will you say to the camera today?',newScript:'New script',quick:'Record the latest script',yours:'YOUR SCRIPTS',nScripts:n=>n===1?'1 script':n+' scripts',
  empty:'No scripts yet. Start a new one above.',ready:'Ready',draft:'Draft',takes:n=>n===1?'1 take':n+' takes',untitled:'Untitled script',scripts:'Back to scripts',record:'Record',del:'Delete script',delAsk:'Delete this script?',take:'Take',practice:'Practice run',toScript:'Back to script',sampleTitle:'Morning habits',
  use:'Use this',another:'Try another',close:'Close',cHook:'Stronger hook',cShorter:'Make it shorter',cWarmer:'Warmer tone',cTrans:'In Ukrainian',cFix:'Fix mistakes',askPh:'Ask: write a script about…',send:'Send',undo:'Undo',thinking:'The moon is thinking…',forHook:'for the first line',forAll:'for the whole script',forNew:'a new script',aiNet:'No internet connection, or Gemini could not be reached.',aiFail:'Moon helper could not answer. Try again in a moment.',aiBusy:'Gemini’s free limit is used up for now. Try again later, or ask ChatGPT instead.',aiBadKey:'This Gemini key does not work. Copy it again and paste it here.',keyTitle:'Connect Moon helper to Gemini. It is free.',keyHow:'1. Open Google AI Studio and sign in with Google.\n2. Tap “Create API key” and copy it.\n3. Paste it below. The key stays only on this phone.',keyLink:'Open Google AI Studio ↗',keyPh:'Paste your Gemini key',gptBtn:'Ask ChatGPT instead',keyBtn:'Gemini key',gptSay:'Your request is copied and ChatGPT is opening. If the question is not there, paste it. Then copy ChatGPT’s answer and paste it here.',gptPh:'Paste ChatGPT’s answer',paste:'Paste',aiRefused:'Moon helper cannot help with this one.',
  tTrim:'Trim',tCaps:'Captions',tLook:'Filter',tMusic:'Music',tTidy:'Pauses',tSound:'Sound',capsOn:'Show captions',capsHint:'Made from your script, timed to your voice.',capsNone:'No word timing for this take, so no captions.',lNone:'Natural',lWarm:'Warm',lSoft:'Soft',lMono:'Black & white',lMoon:'Moon',mNone:'No music',mPad:'Moon pad',mSong:'Your song…',mVol:'Music volume',tidyOn:'Remove pauses',tidyHint:(n,s)=>`Found ${n} ${n===1?'pause':'pauses'}, ${s} s in total.`,tidyNone:'No long pauses found.',sOrig:'Original',s916:'9:16 vertical',notePauses:(n,s)=>`Moon helper found ${n} ${n===1?'pause':'pauses'} (${s} s) you can remove.`,noteCaps:'Captions are ready.'});
Object.assign(T.uk,{ph:'Напиши або встав те, що скажеш…',morning:'Доброго ранку',day:'Добрий день',evening:'Добрий вечір',ask:'Що скажеш камері сьогодні?',newScript:'Новий сценарій',quick:'Записати останній сценарій',yours:'ТВОЇ СЦЕНАРІЇ',nScripts:n=>n+' '+plural(n,'сценарій','сценарії','сценаріїв'),
  empty:'Сценаріїв ще немає. Почни новий вище.',ready:'Готово',draft:'Чернетка',takes:n=>n+' '+plural(n,'дубль','дублі','дублів'),untitled:'Без назви',scripts:'До сценаріїв',record:'Запис',del:'Видалити сценарій',delAsk:'Видалити цей сценарій?',take:'Дубль',practice:'Репетиція',toScript:'До сценарію',sampleTitle:'Ранкові звички',
  use:'Взяти',another:'Інший варіант',close:'Закрити',cHook:'Сильніший початок',cShorter:'Коротше',cWarmer:'Тепліше',cTrans:'Англійською',cFix:'Виправити помилки',askPh:'Попроси: напиши сценарій про…',send:'Надіслати',undo:'Повернути',thinking:'Місяць думає…',forHook:'для першого речення',forAll:'для всього сценарію',forNew:'новий сценарій',aiNet:'Немає інтернету або Gemini недоступний.',aiFail:'Помічник не зміг відповісти. Спробуй ще раз.',aiBusy:'Безкоштовний ліміт Gemini поки вичерпано. Спробуй пізніше або запитай ChatGPT.',aiBadKey:'Цей ключ Gemini не працює. Скопіюй його ще раз і встав сюди.',keyTitle:'Підключи помічника до Gemini. Це безкоштовно.',keyHow:'1. Відкрий Google AI Studio і увійди через Google.\n2. Натисни «Create API key» і скопіюй ключ.\n3. Встав його нижче. Ключ зберігається лише на цьому телефоні.',keyLink:'Відкрити Google AI Studio ↗',keyPh:'Встав ключ Gemini',gptBtn:'Запитати ChatGPT',keyBtn:'Ключ Gemini',gptSay:'Запит скопійовано, ChatGPT відкривається. Якщо питання немає, встав його. Потім скопіюй відповідь ChatGPT і встав сюди.',gptPh:'Встав відповідь ChatGPT',paste:'Вставити',aiRefused:'З цим помічник допомогти не може.',
  tTrim:'Обрізка',tCaps:'Субтитри',tLook:'Фільтр',tMusic:'Музика',tTidy:'Паузи',tSound:'Звук',capsOn:'Показати субтитри',capsHint:'Зі сценарію, у темпі твого голосу.',capsNone:'Для цього дубля немає таймінгу слів, тож субтитрів немає.',lNone:'Природний',lWarm:'Теплий',lSoft:'Ніжний',lMono:'Чорно-білий',lMoon:'Місяць',mNone:'Без музики',mPad:'Місячний фон',mSong:'Твоя пісня…',mVol:'Гучність музики',tidyOn:'Прибрати паузи',tidyHint:(n,s)=>`Знайдено ${n} ${plural(n,'паузу','паузи','пауз')}, разом ${s} с.`,tidyNone:'Довгих пауз немає.',sOrig:'Оригінал',s916:'9:16 вертикально',notePauses:(n,s)=>`Помічник знайшов ${n} ${plural(n,'паузу','паузи','пауз')} (${s} с), які можна прибрати.`,noteCaps:'Субтитри готові.'});
function plural(n,one,few,many){const a=n%10,b=n%100;return a===1&&b!==11?one:a>=2&&a<=4&&(b<12||b>14)?few:many}
const t=k=>T[S.ui][k];
function applyLang(){
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll('[data-tp]').forEach(e=>e.placeholder=t(e.dataset.tp));
  document.querySelectorAll('[data-ta]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.ta)));
  $('#lang').textContent=S.ui==='uk'?'UA':'EN';$('#mode').textContent=t(S.mode);
  document.documentElement.lang=S.ui;$('#cTrans').textContent=t('cTrans');renderHome();renderWrite();
}
$('#lang').onclick=()=>{
  const old=S.ui;S.ui=S.ui==='uk'?'en':'uk';save();
  /* an untouched sample follows the language */
  scripts.forEach(s=>{if(s.text===T[old].sample){s.text=T[S.ui].sample;if(s.title===T[old].sampleTitle)s.title=T[S.ui].sampleTitle}});saveScripts();
  applyLang();
};

/* ---------- scripts ---------- */
const norm=s=>s.toLowerCase().replace(/[’'ʼ`´]/g,'').replace(/[ьъ]/g,'').replace(/[іїийы]/g,'и').replace(/[еєэё]/g,'е').replace(/ґ/g,'г').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
function tokenize(text){const out=[];const re=/\S+/g;let m,last=0;while((m=re.exec(text))){const brk=(text.slice(last,m.index).match(/\n/g)||[]).length;out.push({raw:m[0],n:norm(m[0]).replace(/\s+/g,''),brk});last=m.index+m[0].length}return out}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let scripts=store.get('sf.scripts',null);
if(!Array.isArray(scripts)){ /* first run on v16: keep the text from v15 as the first script */
  const old=store.get('sf.text',null);
  scripts=[{id:uid(),title:old?'':T[S.ui].sampleTitle,text:old!=null&&old.trim()?old:T[S.ui].sample,takes:0,updated:Date.now()}];
}
let curId=store.get('sf.cur',null);
const saveScripts=()=>{store.set('sf.scripts',scripts);store.set('sf.cur',curId)};
const cur=()=>scripts.find(s=>s.id===curId)||scripts[0];
const stats=text=>{const n=tokenize(text).filter(w=>w.n).length,sec=Math.round(n/S.speed*60);return{n,time:Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}};
const titleOf=s=>s.title.trim()||(s.text.trim().split('\n')[0].split(/\s+/).slice(0,6).join(' '))||t('untitled');

let back='write';
function screen(id){['home','write','shoot'].forEach(x=>$('#'+x).hidden=x!==id)}
function greeting(){const h=new Date().getHours();return t(h>=5&&h<12?'morning':h>=12&&h<18?'day':'evening')}
function renderHome(){
  $('#greet').textContent=greeting();
  const list=[...scripts].sort((a,b)=>b.updated-a.updated);
  $('#count2').textContent=list.length?t('nScripts')(list.length):'';
  $('#list').innerHTML=list.length?list.map(s=>{const st=stats(s.text),first=s.text.trim().replace(/\s+/g,' ');
    return `<button class="card" data-id="${s.id}"><span class="t"><b>${esc(titleOf(s))}</b><span class="badge${s.takes?' ready':''}">${t(s.takes?'ready':'draft')}</span></span>`+
      (first&&s.title.trim()?`<span class="p">${esc(first.slice(0,160))}</span>`:'')+
      `<span class="m">${st.n} ${t('words')} · ${t('min')} ${st.time}${s.takes?' · '+t('takes')(s.takes):''}</span></button>`}).join(''):`<p class="empty">${t('empty')}</p>`;
  $('#quick').disabled=!scripts.some(s=>stats(s.text).n);
}
$('#list').onclick=e=>{const c=e.target.closest('.card');if(!c)return;curId=c.dataset.id;saveScripts();openWrite()};
$('#new').onclick=()=>{const s={id:uid(),title:'',text:'',takes:0,updated:Date.now()};scripts.push(s);curId=s.id;saveScripts();openWrite();$('#text').focus()};
$('#quick').onclick=()=>{const s=[...scripts].sort((a,b)=>b.updated-a.updated).find(s=>stats(s.text).n);if(!s)return;curId=s.id;saveScripts();back='home';openCamera()};
function openWrite(){screen('write');if(H.sid!==curId)$('#helper').hidden=true;$('#undo').hidden=true;renderWrite()}
function renderWrite(){
  const s=cur();if(!s)return;
  if($('#title').value!==s.title)$('#title').value=s.title;
  if($('#text').value!==s.text)$('#text').value=s.text;

    warmer:`${script}\n\nRewrite this script in a warmer, more personal tone, like talking to a close friend. Keep the length about the same. Write it in ${L}.`,

  return await new Promise((res,rej)=>{

    const end=()=>{if(stopped)return;stopped=true;v.pause();try{r.resume()}catch(x){}r.stop()};
    const draw=()=>{
      if(!seeking){
        const now=v.currentTime,c=cuts.find(c=>now>=c.s&&now<c.e-.05);
        if(now>=endAt||v.ended){end();return}
        if(c){ /* skip the pause; the recorder waits while the video jumps */
          seeking=true;try{r.pause()}catch(x){}
          v.onseeked=()=>{v.onseeked=null;seeking=false;last=v.currentTime;try{r.resume()}catch(x){}};v.currentTime=Math.min(c.e,endAt);
        }else{
          if(now>last)done+=now-last;last=now;
          cx.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
          if(L){cx.save();cx.globalCompositeOperation=L.mode;cx.fillStyle=L.col;cx.fillRect(0,0,cv.width,cv.height);cx.restore()}
          const cp=capAt(now);if(cp)drawCap(cx,cv.width,cv.height,cp.text);
          hint.textContent=t('rendering')+' '+Math.min(99,Math.round(done/total*100))+'%';
        }
      }
      raf=requestAnimationFrame(draw);
    };
    r.onstop=()=>{cancelAnimationFrame(raf);cleanup();res(new Blob(parts,{type:r.mimeType||'video/mp4'}))};
    r.onerror=ev=>{cancelAnimationFrame(raf);cleanup();rej(ev)};
    r.start(250);v.play().then(()=>{startMusic(0);raf=requestAnimationFrame(draw)},err=>{cleanup();rej(err)});
  });
}
$('#save').onclick=async()=>{
  if(!videoBlob||renderingNow)return;const e=E(),btn=$('#save');
  if(isDefault(e)||!ed){downloadBlob(videoBlob);$('#resultHint').textContent=t('savedHint');return}
  btn.disabled=true;$('#again').disabled=true;
  try{const b=await renderEdited();downloadBlob(b);$('#resultHint').textContent=t('savedHint')}
  catch(err){downloadBlob(videoBlob);$('#resultHint').textContent=t('renderFail')}
  btn.disabled=false;$('#again').disabled=false;
};

$('#vtest').onclick=()=>{
  const out=$('#vtestOut');out.hidden=false;
  if(!SR){out.textContent=t('vtestNo');return}
  if(running)return;
  const r=new SR();r.lang=S.ui==='uk'?'uk-UA':'en-US';r.continuous=true;r.interimResults=true;
  let got='',err='';out.textContent=t('vtestListen')+' · '+r.lang+(stream?' · camera mic on':'');
  r.onresult=e=>{got=[...e.results].map(x=>x[0].transcript).join(' ');out.textContent='🎙 '+got};
  r.onerror=e=>{err=e.error;out.textContent=(got?'🎙 '+got+' · ':'')+'error: '+e.error};
  r.onend=()=>{if(!got&&!err)out.textContent=t('vtestNone')};
  try{r.start()}catch(e){out.textContent='error: '+e.message;return}
  setTimeout(()=>{try{r.stop()}catch(e){}},10000);
};
applyLang();look();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(spans.length)computeLines()});
