<style>
/* Layout: scripts library → script editor → camera with text on top → take. Night look from Quiet Moon, single dark theme by choice. */
:root{
  --bg:#130a1b; --panel:#241532; --panel2:#331f45; --line:#523666; --mist:#8e6fb0; --fg:#f8ecf3; --muted:#c7aabd;
  --rose:#f3a6c4; --blush:#ffd9e8; --gold:#f0c97a; --ink:#130a1b; --rec:#ff8a6b;
  --f:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Cormorant Garamond",Georgia,serif; --disp:"Old Standard TT",Georgia,serif; --sc:"Cormorant SC",Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;font-variant-numeric:lining-nums}
*{box-sizing:border-box}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg)}
@media (min-width:600px){.app{height:min(100%,900px);border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.page{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(18px,calc(env(safe-area-inset-top,0px) + 8px)) max(16px,env(safe-area-inset-right,0px)) max(24px,calc(env(safe-area-inset-bottom,0px) + 12px)) max(16px,env(safe-area-inset-left,0px))}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.sc{font-family:var(--sc);font-weight:700;letter-spacing:.2em;color:var(--gold)}
.iconbtn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:0}
.iconbtn svg{width:22px;height:22px}

/* screen 1: scripts library */
#home{overflow-y:auto;gap:0}
.sky{position:absolute;top:0;left:0;width:100%;height:240px;pointer-events:none}
.hello{position:relative;display:flex;flex-direction:column;gap:6px;padding:28px 8px 0}
.hello .top{display:flex;align-items:center;gap:10px}
.hello .top .sc{font-size:13px}
.ver{font-size:12px;color:var(--muted);font-weight:600;margin-right:auto}
.hello h1{margin:0;font-family:var(--disp);font-weight:400;font-size:34px;line-height:1.15}
.hello p{margin:0;font-family:var(--serif);font-style:italic;font-size:20px;color:var(--muted)}
.acts{position:relative;display:flex;gap:12px;padding:24px 8px 0}
.new{flex:1;min-height:56px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--rose);color:var(--ink);border:0;border-radius:18px;font-weight:800;font-size:16px}
.new svg{width:20px;height:20px}
.quick{width:56px;height:56px;border-radius:18px}
.listhead{display:flex;justify-content:space-between;align-items:baseline;padding:28px 8px 10px}
.listhead h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.14em}
.listhead span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px;padding:0 8px 8px}
.card{display:flex;flex-direction:column;gap:8px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:20px;text-align:left;width:100%}
.card:active{background:var(--panel2)}
.card .t{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card .t b{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid var(--mist)}
.badge.ready{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.card .p{font-size:14px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:12px;color:var(--muted)}
.empty{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--muted);text-align:center;padding:30px 10px}

/* screen 2: script editor */
#write{gap:12px}
.bar{display:flex;align-items:center;gap:10px}
.bar .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#title{width:100%;background:none;border:0;border-bottom:1px solid transparent;padding:2px 0;font-family:var(--serif);font-weight:600;font-size:22px;color:var(--fg)}
#title:focus{outline:none;border-bottom-color:var(--gold)}
#title::placeholder{color:var(--mist)}
.info{color:var(--muted);font-size:12.5px;display:flex;gap:10px}
.pill{border:0;border-radius:999px;background:var(--rose);color:var(--ink);font-weight:800;font-size:15px;padding:0 18px;height:44px;display:flex;align-items:center;gap:8px}
.pill svg{width:18px;height:18px}
.pill:disabled{opacity:.4;cursor:not-allowed}
textarea#text{flex:1;width:100%;min-height:0;resize:none;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;font-family:var(--serif);font-size:21px;font-weight:500;line-height:1.5}
textarea#text:focus{outline:none;border-color:var(--gold)}
textarea#text::placeholder{color:var(--mist);font-style:italic}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.link{background:none;border:0;padding:8px 4px;font-size:14px;font-weight:700;color:var(--muted)}
.link.warn{color:var(--rec)}

/* screen 3: camera */
#shoot{position:absolute;inset:0;background:#000}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cam.mirror{transform:scaleX(-1)}
.nocam{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 80%,#3a2350,#1c1026 45%,#0b0610);display:flex;align-items:flex-end;justify-content:center;padding:0 24px 150px;color:var(--muted);font-size:13px;text-align:center}
.textbox{position:absolute;left:0;right:0;top:0;height:var(--th,42%);overflow:hidden;background:rgba(19,10,27,.58);-webkit-mask:linear-gradient(#000 75%,transparent);mask:linear-gradient(#000 75%,transparent);padding-top:max(6px,env(safe-area-inset-top,0px))}
.textbox::before{content:'';position:absolute;left:50%;top:max(4px,env(safe-area-inset-top,0px));transform:translateX(-50%);width:34px;height:3px;border-radius:2px;background:var(--gold);opacity:.7}
.words{max-width:min(100%,30em);margin:0 auto;padding:0 18px 70%;font-size:var(--ts,32px);line-height:1.3;font-weight:800;color:#fff;will-change:transform;transform:translateZ(0);backface-visibility:hidden}
.words span{transition:color .5s ease}
.words span.done{color:rgba(255,255,255,.35)}
.words span.next{color:var(--gold)}
.timerwrap{position:absolute;left:0;right:0;bottom:max(158px,calc(env(safe-area-inset-bottom,0px) + 146px));z-index:3;display:flex;justify-content:center;pointer-events:none}
.glass{background:rgba(19,10,27,.6);border:1px solid rgba(255,217,232,.18);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.round svg{width:20px;height:20px}
.timer{font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;padding:8px 12px;border-radius:999px;display:flex;align-items:center;gap:7px}
.timer i{width:9px;height:9px;border-radius:50%;background:#777}
.meter{width:42px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;display:none}.meter u{display:block;height:100%;width:0;background:var(--gold);transition:width .08s}.timer.on .meter{display:block}
.timer.on i{background:var(--rec);animation:b 1s infinite}
@keyframes b{50%{opacity:.25}}
.status{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--th,42%) + 6px);z-index:3;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.heard{position:absolute;left:16px;right:16px;bottom:max(202px,calc(env(safe-area-inset-bottom,0px) + 190px));z-index:3;text-align:center;font-size:14px;color:rgba(255,255,255,.85);text-shadow:0 1px 6px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;justify-content:space-evenly;padding:16px 16px max(64px,calc(env(safe-area-inset-bottom,0px) + 52px));background:linear-gradient(transparent,rgba(19,10,27,.7))}
.rec{width:78px;height:78px;border-radius:50%;border:4px solid var(--blush);background:none;display:grid;place-items:center;padding:0}
.rec i{width:60px;height:60px;border-radius:50%;background:var(--rec);transition:all .2s}
.rec.on i{width:28px;height:28px;border-radius:7px}
.mode{height:42px;min-width:84px;border-radius:999px;font-size:13px;font-weight:800;padding:0 14px}
.count{position:absolute;inset:0;z-index:5;display:grid;place-items:center;font-family:var(--disp);font-size:130px;color:var(--blush);text-shadow:0 6px 40px rgba(0,0,0,.6);pointer-events:none}
.panel{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 20px max(24px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:700}
.row span{flex:1}
.row input{width:50%;accent-color:var(--rose)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:16px;padding:12px;font-weight:800}
.btn.main{background:var(--rose);color:var(--ink);border-color:var(--rose)}
.btn:disabled{opacity:.5}
.done video{width:100%;max-height:34vh;border-radius:16px;background:#000}
.done{max-height:92%;overflow-y:auto}
.rhead{display:flex;align-items:center;gap:10px}
.rhead b{flex:1;font-family:var(--serif);font-weight:600;font-size:22px}
.rhead .iconbtn{width:40px;height:40px;background:var(--panel2)}
.edit{display:flex;flex-direction:column;gap:8px}.edit .row{font-size:13.5px}.edit .row input{width:46%}.edit output{font-size:12px;color:var(--muted);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:13px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <!-- 1. scripts library -->
  <section id="home" class="page">

  <section id="shoot" hidden>
    <video id="cam" playsinline muted hidden></video>
    <div class="nocam" id="nocam"><span data-t="nocam"></span></div>

    <div class="timerwrap"><div class="timer glass" id="timer"><i></i><span>00:00</span><b class="meter" id="meter"><u></u></b></div></div>
    <div class="status glass" id="status" hidden></div>
    <div class="heard" id="heard" hidden></div>
    <div class="bottom">
      <button class="round glass" id="close" data-ta="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="round glass" id="flip" data-ta="flip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 15a8 8 0 0 1-14 3l-2-2"/><path d="M20 4v4h-4M4 20v-4h4"/></svg></button>
      <button class="rec" id="rec" data-ta="rec"><i></i></button>
      <button class="mode glass" id="mode"></button>
      <button class="round glass" id="settings" data-ta="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>

    <div class="panel" id="panel" hidden>

    </div>
  </section>

if(S.height===42)S.height=30;if(S.speed===120)S.speed=160;

function voiceChain(src,o){
  const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=110;hp.Q.value=.7;
  const hp2=AC.createBiquadFilter();hp2.type='highpass';hp2.frequency.value=110;hp2.Q.value=.7; /* two stages: cuts the thumps from hand movement */
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=13000;              /* cuts hiss above the voice */
  const gate=makeGate(o.noise);
  const lev=AC.createGain();lev.gain.value=dB(o.level||0);
  const pres=AC.createBiquadFilter();pres.type='peaking';pres.frequency.value=3200;pres.Q.value=.8;pres.gain.value=o.clarity*6;
  const mud=AC.createBiquadFilter();mud.type='lowshelf';mud.frequency.value=220;mud.gain.value=-o.clarity*4;
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-22;comp.knee.value=12;comp.ratio.value=2;comp.attack.value=.008;comp.release.value=.3;
  const vol=AC.createGain();vol.gain.value=dB(o.vol||0);
  const lim=AC.createDynamicsCompressor();lim.threshold.value=-7;lim.knee.value=2;lim.ratio.value=20;lim.attack.value=.001;lim.release.value=.12;
  const trim=AC.createGain();trim.gain.value=dB(-1.5);                                         /* headroom: no crackle from clipping */
  let n=src;[hp,hp2,lp,gate,lev,mud,pres,comp,vol,lim,trim].forEach(x=>{if(x){n.connect(x);n=x}});
  return{hp,gate,lev,pres,mud,vol,out:trim};
}
function recordStream(){
  const a=stream&&stream.getAudioTracks()[0];
  if(!a||!AC)return stream;
  try{
    const src=AC.createMediaStreamSource(new MediaStream([a]));
    const ch=voiceChain(src,{noise:.15,clarity:0,level:4,vol:0});
    const an=AC.createAnalyser();an.fftSize=1024;ch.hp.connect(an);
    const out=AC.createAnalyser();out.fftSize=1024;ch.out.connect(out);
    const dst=AC.createMediaStreamDestination();ch.out.connect(dst);
    proc={src,lev:ch.lev,an,out,g:4,auto:false,buf:new Float32Array(1024)};
    return new MediaStream([...stream.getVideoTracks(),dst.stream.getAudioTracks()[0]]);
  }catch(e){proc=null;return stream}
}
function rms(an,buf){an.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];return 20*Math.log10(Math.sqrt(s/buf.length)+1e-9)}
function soundTick(dt){
  if(!proc)return;
  const inDb=rms(proc.an,proc.buf);
  if(proc.auto&&inDb>-65){ /* only while she is talking, so silence is not pumped up */
    const want=Math.max(0,Math.min(24,-24-inDb));
    proc.g+=Math.max(-24*dt,Math.min(8*dt,want-proc.g));
    proc.lev.gain.setTargetAtTime(dB(proc.g),AC.currentTime,.05);
  }
  const o=rms(proc.out,proc.buf);$('#meter u').style.width=Math.max(0,Math.min(100,(o+50)*2.2))+'%';
}
function stopSound(){if(proc){try{proc.src.disconnect()}catch(e){}proc=null}}

/* record */
function mime(){if(!window.MediaRecorder)return null;for(const m of['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm'])if(MediaRecorder.isTypeSupported(m))return m;return ''}
$('#rec').onclick=async()=>{
  if(running){stopRun(true);return}
  ensureAC();if(gateReady)gateReady.then(ok=>gateOK=ok);
  $('#panel').hidden=true;
  if(pos()>=W.length)resetPos();
  const c=$('#count');c.hidden=false;for(const n of[3,2,1]){c.textContent=n;await new Promise(r=>setTimeout(r,800))}c.hidden=true;
  elapsed=0;running=true;paused=false;chunks=[];rec=null;useAuto=S.mode==='auto';fpos=shown;syncVoice();
  if(stream){const m=mime();if(m!==null){try{const rs=recordStream();rec=new MediaRecorder(rs,Object.assign({videoBitsPerSecond:6000000,audioBitsPerSecond:128000},m?{mimeType:m}:{}));rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.start(500)}catch(e){rec=null}}}
  $('#rec').classList.add('on');setTimer();
  if(!useAuto)startVoice();
  try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){}
};
let wake=null;
function stopRun(showResult){
  if(!running)return;running=false;stopVoice();setTimeout(stopSound,600);clearTimeout(loop.end);loop.end=null;$('#rec').classList.remove('on');setTimer();status('');
  try{wake&&wake.release()}catch(e){}wake=null;
  const finish=()=>{if(!showResult)return;
    if(videoUrl)URL.revokeObjectURL(videoUrl);videoUrl=null;
    const v=$('#play');
    stopCam(); /* while the mic is open, iPhone plays sound quietly like a phone call */
    if(chunks.length){const sc=cur();sc.takes=(sc.takes||0)+1;sc.updated=Date.now();saveScripts();$('#takeTitle').textContent=t('take')+' '+sc.takes;const b=new Blob(chunks,{type:rec.mimeType||'video/webm'});videoBlob=b;videoUrl=URL.createObjectURL(b);v.src=videoUrl;v.hidden=false;$('#save').hidden=false;$('#edit').hidden=false;$('#resultHint').textContent='';setupEditor()}
    else{$('#takeTitle').textContent=t('practice');v.hidden=true;$('#save').hidden=true;$('#edit').hidden=true;$('#resultHint').textContent=t('noVideo')}
    $('#result').hidden=false;
  };
  if(rec&&rec.state!=='inactive'){rec.onstop=finish;rec.stop()}else finish();
}
$('#again').onclick=()=>{$('#result').hidden=true;$('#play').pause();resetPos();startCam()};
/* ---------- editor: hear changes while playing, apply them when saving ---------- */
let videoBlob=null,ed=null;
const E=()=>({vol:+$('#eVol').value,noise:0,clarity:0,start:+$('#eStart').value,end:+$('#eEnd').value});
const secs=x=>x.toFixed(1)+' s';
function edLabels(){const e=E();$('#oVol').textContent=(e.vol>0?'+':'')+e.vol+' dB';$('#oStart').textContent=secs(e.start);$('#oEnd').textContent=secs(e.end)}
/* clip length; Chrome's webm reports Infinity until it has been read once, so fall back to the recorded time */
const clipLen=()=>{const d=$('#play').duration;return isFinite(d)&&d>0?d:elapsed};
function trimMax(){const m=Math.max(0,Math.floor(clipLen()*10)/10-1);['eStart','eEnd'].forEach(id=>{const el=$('#'+id);el.max=m;if(+el.value>m)el.value=m});keepGap();edLabels()}
/* keep at least one second between the two cuts */
function keepGap(moved){const s=$('#eStart'),e=$('#eEnd'),room=clipLen()-1;if(+s.value+ +e.value>room){if(moved==='eEnd')s.value=Math.max(0,room-e.value);else e.value=Math.max(0,room-s.value)}}
['eStart','eEnd'].forEach(id=>$('#'+id).oninput=()=>{keepGap(id);edLabels();const v=$('#play'),e=E();v.currentTime=id==='eStart'?e.start:Math.max(e.start,clipLen()-e.end-1.5)});
$('#play').addEventListener('loadedmetadata',trimMax);
$('#play').addEventListener('durationchange',trimMax);
$('#play').addEventListener('play',()=>{const v=$('#play'),e=E();if(v.currentTime<e.start||v.currentTime>=clipLen()-e.end-.05)v.currentTime=e.start});
$('#play').addEventListener('timeupdate',()=>{const v=$('#play'),e=E();if(!renderingNow&&e.end>0&&v.currentTime>=clipLen()-e.end){v.pause();v.currentTime=clipLen()-e.end}});
let renderingNow=false;
function setupEditor(){
  const v=$('#play');
  $('#eVol').value=0;$('#eStart').value=0;$('#eEnd').value=0;trimMax();
  ensureAC();
  if(gateReady)gateReady.then(ok=>{gateOK=ok;applyEd()});
  try{
    if(!ed){ /* one media source per video element, kept for the session */
      const src=AC.createMediaElementSource(v);const mon=AC.createGain();mon.connect(AC.destination);
      ed={src,mon,ch:null};
    }
    applyEd();
  }catch(e){ed=null}
}
function applyEd(){
  if(!ed)return;const e=E();
  try{ed.src.disconnect()}catch(x){}if(ed.ch)try{ed.ch.out.disconnect()}catch(x){}
  ed.ch=voiceChain(ed.src,{noise:e.noise,clarity:e.clarity,vol:e.vol,level:0});ed.ch.out.connect(ed.mon);
}
$('#eVol').oninput=()=>{edLabels();applyEd()};
function downloadBlob(b){const ext=(b.type||'').includes('mp4')?'mp4':'webm';const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='video-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.'+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
const isDefault=e=>e.vol===0&&!e.start&&!e.end;
/* saving with changes plays the clip once through the sound chain and records it again (takes as long as the clip) */
async function renderEdited(){
  const v=$('#play'),e=E();
  const cv=document.createElement('canvas');cv.width=v.videoWidth||720;cv.height=v.videoHeight||1280;const cx=cv.getContext('2d');
  if(!cv.captureStream||!ed)throw new Error('no capture');
  const dst=AC.createMediaStreamDestination();ed.ch.out.connect(dst);ed.mon.gain.value=0;
  const out=new MediaStream([cv.captureStream(30).getVideoTracks()[0],dst.stream.getAudioTracks()[0]]);
  const m=mime();const r=new MediaRecorder(out,Object.assign({videoBitsPerSecond:8000000,audioBitsPerSecond:160000},m?{mimeType:m}:{}));
  const parts=[];r.ondataavailable=x=>{if(x.data.size)parts.push(x.data)};
  const endAt=clipLen()-e.end;renderingNow=true;
  v.pause();v.currentTime=e.start;await new Promise(res=>{v.onseeked=()=>{v.onseeked=null;res()};setTimeout(res,800)});
  const hint=$('#resultHint');
  return await new Promise((res,rej)=>{
    let raf=0;const draw=()=>{cx.drawImage(v,0,0,cv.width,cv.height);hint.textContent=t('rendering')+' '+Math.min(99,Math.round((v.currentTime-e.start)/(endAt-e.start)*100))+'%';
      if(v.currentTime>=endAt||v.ended){v.pause();r.stop();return}raf=requestAnimationFrame(draw)};
    r.onstop=()=>{renderingNow=false;cancelAnimationFrame(raf);try{ed.ch.out.disconnect(dst)}catch(x){}ed.mon.gain.value=1;res(new Blob(parts,{type:r.mimeType||'video/mp4'}))};
    r.onerror=ev=>{renderingNow=false;ed.mon.gain.value=1;rej(ev)};
    r.start(250);v.play().then(()=>{raf=requestAnimationFrame(draw)},rej);
  });
}
$('#save').onclick=async()=>{
  if(!videoBlob)return;const e=E(),btn=$('#save');
  if(isDefault(e)||!ed){downloadBlob(videoBlob);$('#resultHint').textContent=t('savedHint');return}
  btn.disabled=true;$('#again').disabled=true;
  try{const b=await renderEdited();downloadBlob(b);$('#resultHint').textContent=t('savedHint')}
  catch(err){downloadBlob(videoBlob);$('#resultHint').textContent=t('renderFail')}
  btn.disabled=false;$('#again').disabled=false;
};

$('#vtest').onclick=()=>{
  const out=$('#vtestOut');out.hidden=false;
  if(!SR){out.textContent=t('vtestNo');return}
  if(running)return;
  const r=new SR();r.lang=S.ui==='uk'?'uk-UA':'en-US';r.continuous=true;r.interimResults=true;
  let got='',err='';out.textContent=t('vtestListen')+' · '+r.lang+(stream?' · camera mic on':'');
  r.onresult=e=>{got=[...e.results].map(x=>x[0].transcript).join(' ');out.textContent='🎙 '+got};
  r.onerror=e=>{err=e.error;out.textContent=(got?'🎙 '+got+' · ':'')+'error: '+e.error};
  r.onend=()=>{if(!got&&!err)out.textContent=t('vtestNone')};
  try{r.start()}catch(e){out.textContent='error: '+e.message;return}
  setTimeout(()=>{try{r.stop()}catch(e){}},10000);
};
applyLang();look();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(spans.length)computeLines()});
</script>
