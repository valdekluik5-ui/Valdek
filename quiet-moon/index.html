<style>
/* Layout: one-screen phone app under a night sky; plum ground, rose and candle-gold light, bottom tab bar. Deliberately single dark look. */
:root{
  --night:#130a1b; --plum:#241532; --plum-2:#331f45; --line:#523666; --mist:#8e6fb0;
  --rose:#f3a6c4; --blush:#ffd9e8; --gold:#f0c97a; --ink:#f8ecf3; --muted:#c7aabd; --ember:#ff8a6b;
  --display:"Old Standard TT", "Cormorant Garamond", Georgia, serif;
  --quote:"Cormorant Garamond", Georgia, serif;
  --rune:"Cormorant SC", "Cormorant Garamond", Georgia, serif;
  --body:"Nunito", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(90% 50% at 50% 0%, #3d1f52 0%, transparent 70%),radial-gradient(70% 40% at 100% 100%, rgba(142,111,176,.18), transparent 70%),var(--night);color:var(--ink);font:16px/1.55 var(--body);display:flex;flex-direction:column;overflow:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;flex:1;overflow-y:auto;padding-block:22px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.1;letter-spacing:.01em}
h1{font-size:2.3rem} h2{font-size:1.9rem}
h1 em,h2 em{color:var(--rose);font-style:italic}
p{margin:0}
.muted{color:var(--muted);font-size:.95rem}
.label{font-family:var(--rune);font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}
.label::before{content:'\2726  '}

button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.big{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:linear-gradient(135deg,var(--plum-2),var(--plum));border:1px solid rgba(240,201,122,.35);border-radius:6px 28px 6px 28px;box-shadow:inset 0 0 0 4px var(--night),inset 0 0 0 5px rgba(240,201,122,.18),0 8px 30px rgba(0,0,0,.35);padding:18px;transition:transform .2s,border-color .2s}
.big:active{transform:scale(.98)}
.big:hover{border-color:var(--gold)}
.big .dot{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--blush),var(--rose));color:var(--night);box-shadow:0 0 0 3px var(--night),0 0 0 4px var(--gold),0 0 24px rgba(243,166,196,.45)}
.big strong{display:block;font-family:var(--display);font-size:1.35rem;font-weight:400;line-height:1.15}
.big span.s{color:var(--muted);font-size:.9rem}
.primary{background:linear-gradient(135deg,var(--blush),var(--rose));color:var(--night);border:1px solid var(--gold);border-radius:999px;padding:13px 24px;font-family:var(--rune);font-size:.88rem;letter-spacing:.08em;font-weight:700;box-shadow:0 6px 24px rgba(243,166,196,.3)}
.ghost{background:transparent;border:1px solid rgba(240,201,122,.4);border-radius:999px;padding:11px 20px;color:var(--gold);font-family:var(--rune);font-size:.85rem;letter-spacing:.08em}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--plum);border-radius:999px;padding:9px 15px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--rose);color:var(--night);border-color:var(--rose);font-weight:700}
.card{position:relative;background:linear-gradient(180deg,rgba(51,31,69,.88),rgba(36,21,50,.88));border:1px solid rgba(240,201,122,.3);border-radius:4px;box-shadow:inset 0 0 0 4px rgba(19,10,27,.7),inset 0 0 0 5px rgba(240,201,122,.14);padding:18px;display:flex;flex-direction:column;gap:12px}
.card::before,.card::after{content:'\2726';position:absolute;top:6px;color:var(--gold);font-size:.7rem;opacity:.7}
.card::before{left:9px}.card::after{right:9px}
.quote{font-family:var(--quote);font-size:1.35rem;line-height:1.35;font-style:italic;color:var(--blush)}
nav{position:relative;z-index:2;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(26,16,36,.92);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{background:none;border:0;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74rem;color:var(--muted)}
nav button[aria-current="true"]{color:var(--gold);font-weight:700}
nav button{font-family:var(--rune);letter-spacing:.04em}
nav svg{width:24px;height:24px}
/* moon breathing */
.breath{display:grid;place-items:center;height:310px;position:relative}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff4f9,var(--blush) 35%,var(--rose) 75%);transform:scale(1);transition:transform 4s ease-in-out,box-shadow 4s ease-in-out;box-shadow:0 0 40px rgba(243,166,196,.45)}
.orb.big{transform:scale(2);box-shadow:0 0 120px rgba(243,166,196,.7)}
.orb-label{position:absolute;font-family:var(--quote);font-size:1.6rem;font-style:italic;color:var(--night);pointer-events:none;font-weight:600}
.whisper{text-align:center;font-family:var(--quote);font-style:italic;font-size:1.25rem;color:var(--blush);min-height:1.6em;transition:opacity .8s}
.count{font-variant-numeric:tabular-nums}
.crystals{display:flex;gap:12px;flex-wrap:wrap}
.crystals button{width:42px;height:50px;border:0;background:none;padding:0}
.crystals svg path{fill:var(--plum-2);stroke:var(--rose);stroke-width:1.5;transition:fill .4s,filter .4s}
.crystals button.on svg path{fill:var(--rose);filter:drop-shadow(0 0 8px var(--rose))}
/* body */
.bodywrap{display:flex;justify-content:center}
.bodymap{width:100%;max-width:230px;height:auto}
.bodymap .z,.bodymap .zp{fill:rgba(243,166,196,.12);stroke:var(--rose);stroke-width:1.4;cursor:pointer;transition:fill .3s,filter .3s}
.bodymap g.z{fill:none;stroke:none}
.bodymap .z.on,.bodymap g.z.on .zp{fill:var(--rose);filter:drop-shadow(0 0 10px var(--rose))}
.bodymap g.z.on{fill:none;filter:none}
.bodymap .z:focus-visible,.bodymap g.z:focus-visible .zp{outline:none;stroke:var(--gold);stroke-width:3}
.feel{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.feel button{border:1.5px solid var(--line);border-radius:18px;padding:14px 12px;text-align:left;background:var(--plum);display:flex;flex-direction:column;gap:6px}
.feel button i{display:block;width:24px;height:24px;border-radius:50%;box-shadow:0 0 12px currentColor}
.feel button strong{font-family:var(--display);font-size:1.2rem;line-height:1.1}
.feel button[aria-pressed="true"]{border-color:var(--gold);background:var(--plum-2)}
.feel small{color:var(--muted);font-size:.8rem;line-height:1.3}
input[type=range]{width:100%;accent-color:var(--rose)}
textarea,input[type=text]{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:rgba(26,16,36,.7);border:1px solid var(--line);border-radius:14px;padding:12px}
textarea{min-height:80px;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--muted);opacity:.8}
/* tarot-style cards */
.deck{display:grid;place-items:center;padding:8px 0;perspective:1200px}
.tcard{width:min(260px,78vw);aspect-ratio:2/3.2;max-width:100%;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1);cursor:pointer;border:0;background:none;padding:0}
.tcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;box-sizing:border-box;border:1.5px solid var(--gold)}
.back{background:repeating-linear-gradient(45deg,rgba(240,201,122,.08) 0 2px,transparent 2px 14px),linear-gradient(160deg,#4a2a5e,#241433);box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 0 0 8px rgba(26,16,36,.6)}
.back::before{content:'';position:absolute;inset:14px;border:1px solid rgba(240,201,122,.45);border-radius:12px}
.back::after{content:'\2726   \2726';position:absolute;bottom:22px;color:var(--gold);letter-spacing:.3em;font-size:.8rem}
.back .glyph{font-size:4rem;color:var(--gold);text-shadow:0 0 24px var(--gold);font-family:var(--display)}
.back small{color:var(--gold);letter-spacing:.2em;text-transform:uppercase;font-size:.7rem}
.front{transform:rotateY(180deg);background:linear-gradient(170deg,#fff3f8,#ffd9e8 60%,#f6bcd3);color:#3a1d45;text-align:center;box-shadow:0 12px 40px rgba(243,166,196,.35)}
.front .glyph{font-size:3rem;line-height:1;color:#b04a7c;font-family:var(--display)}
.front h3{margin:0;font-family:var(--rune);font-size:1.15rem!important;font-size:1.5rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.front p{font-family:var(--quote);font-size:1.18rem;line-height:1.35;font-style:italic}
/* burn */
.flame{width:56px;height:80px;margin:0 auto;position:relative}
.flame i{position:absolute;left:50%;bottom:18px;width:26px;height:44px;margin-left:-13px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff6d8,var(--gold) 40%,var(--ember) 80%,transparent);animation:flick 1.6s ease-in-out infinite;filter:drop-shadow(0 0 14px var(--ember))}
.flame b{position:absolute;left:50%;bottom:0;width:30px;height:20px;margin-left:-15px;background:var(--blush);border-radius:4px 4px 8px 8px}
@keyframes flick{0%,100%{transform:scaleY(1) rotate(-2deg)}50%{transform:scaleY(1.12) rotate(2deg)}}
.burnzone{min-height:90px;font-family:var(--quote);font-size:1.4rem;font-style:italic;text-align:center;line-height:1.4;color:var(--blush);overflow-wrap:anywhere}
.burnzone span{display:inline-block;white-space:pre;transition:transform 2.2s ease-out,opacity 2.2s ease-out,color 1s,filter 2s}
.burnzone.go span{color:var(--ember);filter:blur(2px)}
/* hearts game */
.field{position:relative;height:380px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(80% 60% at 50% 100%,rgba(243,166,196,.18),transparent),rgba(26,16,36,.6)}
.heart{position:absolute;bottom:-60px;width:52px;height:52px;border:0;background:none;padding:0;animation:rise linear forwards}
.heart svg{width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(243,166,196,.7))}
.heart.pop{animation-play-state:paused}
.heart svg{transition:transform .35s,opacity .35s}
.heart.pop svg{transform:scale(1.8);opacity:0}
@keyframes rise{from{transform:translateY(0) translateX(0)}50%{transform:translateY(-230px) translateX(14px)}to{transform:translateY(-470px) translateX(-10px)}}
.hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:2}
.hud .n{font-family:var(--display);font-size:1.6rem;color:var(--blush)}
.reward{position:absolute;left:16px;right:16px;bottom:16px;text-align:center;font-family:var(--quote);font-style:italic;font-size:1.2rem;color:var(--ink);opacity:0;transition:opacity .6s;pointer-events:none;z-index:2;text-shadow:0 2px 12px var(--night)}
.reward.show{opacity:1}
.msg .text{font-family:var(--quote);font-size:1.25rem;line-height:1.4}
.toast{position:fixed;z-index:5;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--blush);color:var(--night);padding:10px 20px;border-radius:999px;font-size:.92rem;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.entry{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.entry:first-child{border-top:0;padding-top:0}
.entry strong{font-family:var(--display);font-size:1.2rem}
.tag{display:inline-block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--gold);color:var(--gold);padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
ul.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
ul.tips li::marker{color:var(--rose)}
.divider{text-align:center;color:var(--gold);letter-spacing:.5em;font-size:1rem;opacity:.75}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:4px}
.sigil{width:min(230px,64vw);max-width:100%;height:auto}
.sigil .ring{animation:spin 120s linear infinite;transform-origin:120px 120px}
.sigil text{font-family:var(--rune);fill:var(--gold);font-size:11px;letter-spacing:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.phase{font-family:var(--rune);color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-size:.78rem}
.phase-note{font-family:var(--quote);font-style:italic;font-size:1.2rem;color:var(--blush)}
/* heart burst on taps */
.burst{position:fixed;z-index:6;width:16px;height:16px;pointer-events:none;animation:burst .9s ease-out forwards}
.burst svg{width:100%;height:100%}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}}
/* cauldron */
.stirzone{position:relative;width:min(300px,84vw);max-width:100%;aspect-ratio:1;margin:0 auto;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.stirzone svg{width:100%;height:100%;overflow:visible}
.bubble{animation:bub 2.4s ease-in forwards}

/* home-screen app: pin to the real screen edges (iOS standalone reports 100% short and leaves a band at the bottom) */
:root{padding-top:0!important;padding-bottom:0!important}
body{position:fixed;inset:0;height:auto}
html{background:#1a1024}

/* Auto-scaler: the home screen is designed on her iPhone (430 x 881 app area) and scaled evenly to any screen.
   --u is set by the script in <head> (screen size / design size); --adj is an extra size factor from the Quiet Moon Tuner.
   The --qm-* values are the Tuner settings in design pixels. */
:root{--qm-top:0;--qm-wheel:190;--qm-title:26;--qm-hgap:36;--qm-tgap:25;--qm-icon:49;--qm-ttext:23;--qm-bgap:39;--qm-bz:1.11;--qm-by:-80;--qm-bot:0;--adj:1}
html body{--s:calc(var(--u,1) * var(--adj,1))}
html body main{padding-top:calc(max(env(safe-area-inset-top,0px), var(--qm-sat,0px), 59px * var(--s)) + var(--qm-top) * var(--s) * 1px)!important;padding-bottom:calc(12px * var(--s))!important;padding-left:calc(16px * var(--s))!important;padding-right:calc(16px * var(--s))!important}
html body nav{padding-bottom:calc(var(--qm-bot) * var(--s) * 1px)!important}
html body nav button{padding:calc(10px * var(--s)) 2px calc(12px * var(--s))!important;gap:calc(3px * var(--s))!important;font-size:calc(11.84px * var(--s))!important}
html body nav svg{width:calc(24px * var(--s))!important;height:calc(24px * var(--s))!important}
html body .v-now{max-width:calc(398px * var(--s))!important;gap:calc(18px * var(--s))!important}
html body .v-now .hero-row{grid-template-columns:calc(var(--qm-wheel) * var(--s) * 1px) 1fr!important;gap:calc(14px * var(--s))!important;margin-bottom:calc(var(--qm-hgap) * var(--s) * 1px)!important}
html body .v-now .hero-row .sig-wrap,html body .v-now .hero-row .sigil{width:calc(var(--qm-wheel) * var(--s) * 1px)!important}
html body .v-now .sticker{width:calc(30px * var(--s))!important;height:calc(30px * var(--s))!important;padding:calc(6px * var(--s))!important}
html body .v-now .lang{font-size:calc(11.5px * var(--s))!important}
html body .v-now .hero-txt .label{font-size:calc(11.84px * var(--s))!important;padding-right:calc(30px * var(--s))!important}
html body .v-now h1{font-size:calc(var(--qm-title) * var(--s) * 1px)!important}
html body .v-now .hero-txt .phase{font-size:calc(10.56px * var(--s))!important;margin-top:calc(4px * var(--s))!important}
html body .v-now .hero-txt .phase-note{font-size:calc(17.6px * var(--s))!important}
html body .v-now .grid2{gap:calc(var(--qm-tgap) * var(--s) * 1px)!important}
html body .v-now .grid2 .big{padding:calc(13.2px * var(--s)) calc(14px * var(--s))!important;gap:calc(8.8px * var(--s))!important}
html body .v-now .grid2 .big .dot{width:calc(var(--qm-icon) * var(--s) * 1px)!important;height:calc(var(--qm-icon) * var(--s) * 1px)!important}
html body .v-now .grid2 .big .dot svg{width:calc(22px * var(--s));height:calc(22px * var(--s))}
html body .v-now .grid2 .big strong{font-size:calc(var(--qm-ttext) * var(--s) * 1px)!important}
html body .v-now .grid2 .big span.s{font-size:calc(15.2px * var(--s))!important;margin-top:calc(3px * var(--s))!important}
html body .v-now .note-link.stage{margin-inline:calc(-16px * var(--s))!important;width:calc(100% + 32px * var(--s))!important;margin-top:calc((var(--qm-bgap) - 18) * var(--s) * 1px)!important;padding-top:calc((var(--qm-bz) - 1) * 124px * var(--s))!important;margin-bottom:calc(var(--qm-by) * var(--s) * 1px)!important}
html body .v-now .bearstage{transform:scale(var(--qm-bz));transform-origin:50% 100%;translate:0 calc(var(--qm-by) * var(--s) * 1px);max-height:none!important}

  deck:[['Тиха вода','Ти замовкла, бо частинка тебе берегла щось дуже цінне. Їй треба подякувати, а не сварити.'],['Спадний місяць','Місяць теж іноді зникає, і ніхто не каже, що він зламаний. Тобі можна мати свої темні ночі.'],['Жаринка','Те, що горить у тобі, — не «забагато». Це тепло, яке ще шукає безпечне місце.'],['Ключ','Ти нікому не винна пояснень, поки не готова. Слова зачекають. Ти нікуди не запізнюєшся.'],['Троянда','Твої колючки виросли не просто так. Хтось ніжний навчиться обіймати тебе правильно.'],['Оберіг','Безпека будується потроху, подих за подихом. Перший камінчик ти вже поклала.'],['Ворон','Почуття, що прийшло сьогодні, — посланець. Його лист можна прочитати пізніше, коли руки перестануть тремтіти.'],['Хвиля','Зсередини хвилі здається, що вона ніколи не скінчиться. Але хвилі завжди відступають. І ця відступить.'],['Ліхтарик','Не треба бачити всю дорогу. Досить світла на один маленький крок.'],['Дзеркало','Подивись на себе так, як на налякане дитя: м’яко й без поспіху.'],['Верба','Гнутися — не означає зламатися. Можна похитатися з вітром і втримати всі корені.'],['Срібна нитка','Щоразу, коли ти повертаєшся до дихання, ти зшиваєш себе трішки міцніше.'],['Оксамитова ніч','Відпочинок — теж магія. Іноді найсміливіше заклинання — лягти й дозволити світу почекати.'],['Кристал','Тиск тебе загартував, але не він тут головний. Під усім цим ти чиста і світла.'],['Нічний метелик','Після всього ти все одно летиш до світла. Це не наївність. Це надія, і вона твоя.'],['Зернятко','У тобі тихенько щось проростає. Не розкопуй, щоб перевірити. Просто довірся.'],['Свічка','Один маленький вогник розганяє темряву в цілій кімнаті. А ти — набагато більше, ніж один вогник.'],['Казанок','Усім твоїм почуттям є місце в одному казанку. Жодне з них не отрута. Якщо помішувати повільно, виходить мудрість.'],['Сова','Ти помічаєш те, чого інші не бачать. Ця чутливість — дар, навіть коли вона болить.'],['Схована зірка','Сьогодні можна не сяяти. Зорі лишаються зорями навіть за хмарами.'],['Хвіртка','Тільки ти вирішуєш, кого і коли впускати. Зачинена хвіртка — це не жорстокість, а твоя межа.'],['Терпляче серце','Справжня любов уміє чекати. Вона не витягує тебе з мушлі, а тихо сідає поруч.'],['Повня','Колись слова повернуться самі, тихо-тихо. А поки твоя тиша — теж ти, і її теж люблять.'],['Серце','Ти не «забагато» і не «замало». Ти саме така, як треба. Навіть зараз.']],
  burn:{label:'Ритуал зі свічкою',h:'Спали <em>тривогу</em>',p:'Напиши слово-два або нічого. Свічка зрозуміє. Ніхто, крім неї, цього не побачить.',ph:'Що тебе гнітить… (можна не писати)',btn:'Віддати полум’ю',def:'✦ ♡ ✦  усе важке  ✦ ♡ ✦',after:['Тепер це просто дим. Можна більше не тримати його в руках.','Полум’я все забрало. Стало легше, а ти залишилася собою.','Хай воно розтане в нічному небі. На сьогодні ти зробила достатньо.','Пішло в темряву. Так минає кожна буря.']},
  hearts:{label:'Повільна гра',h:'Лови <em>сердечка</em>',p:'Тут не можна програти, і поспішати теж не треба. Просто лови їх, поки вони пливуть угору.',caught:'зловлено',words:['П’ять іскорок доброти! Залиш кілька собі.','Руки вже спокійніші. Серце теж наздожене.','Ніжність — це сила. І ти зараз це доводиш.','Кожне сердечко — твоє по праву.','Подивись, якою ніжною ти можеш бути до себе.']},
  cauldron:{label:'Казанок',h:'Звари <em>зілля</em>',p:'Повільно води пальцем по колу навколо казанка. Сім кіл — і зілля готове.',yours:'Твоє зілля',again:'Зварити ще',ready:'Зілля готове ♡'},
  potions:[['Зілля терпіння','Для днів, коли все тягнеться. Діє тихо, як коріння, що росте в темряві.'],['Відвар тихої води','Три ковтки — і буря всередині стає легкими брижами. А брижі втримати легко.'],['Еліксир любові до себе','На смак як теплий мед і прощення. Можна пити скільки хочеш.'],['Місячне молочко','Зварене під лагідним місяцем. Нагадує тілу, що відпочивати можна і безпечно.'],['Відвар маленьких кроків','Великої сміливості сьогодні не треба. Лише на один маленький крок. Тут її рівно стільки.'],['Чай «Відпусти»','Завари, вдихни, відпусти. Те, що ти так міцно стискаєш, можна на хвилинку покласти.'],['Трояндове зілля','Для серця, яке надто довго було насторожі. Нічого не відчиняє силою. Тільки зігріває.']],
  candles:{label:'Вівтар',h:'Запали <em>свічки</em>',p:'Запалюй у будь-якому порядку. Кожен вогник приносить слово.',words:['безпека','ніжність','сила','любов','спокій','світло','дім'],snuff:'Загасити',lines:['Сім вогників — і всі для тебе. Хай вони потримають темряву замість тебе.','Ти — кожне з цих слів. Навіть у дні, коли так не здається.'],light:'Запалити свічку'},
  constel:{label:'Зоряна карта',h:'Намалюй <em>сузір’я</em>',p:'Торкайся зірочки, що світиться, і веди лінію далі. Що з’явиться цього разу?',again:'Нове небо',count:'Сузір’їв зібрано',
    names:['Сузір’я Серця','Сузір’я Місяця','Сузір’я Зірки','Сузір’я Кристала','Сузір’я Корони','Сузір’я Овна'],
    msgs:['Навіть у найтемніше небо хтось колись вписав красу. І в тебе теж.','Ти зібрала окремі вогники в одне ціле. Так само складуться й думки.','Кожна зірка була сама. Разом вони — історія. І ти не сама.','Зорі не поспішають, а сяють тисячі років. Тобі теж можна повільно.','Те, що здавалося хаосом, мало форму. Треба було лише з’єднати вогники.','Це небо намалювала ти. Подивись, яку красу вміють творити твої руки.','Світло цих зірок летіло до тебе роками. Деякі речі варті чекання.','Ти теж чиєсь сузір’я: усі твої риси разом — щось неповторне.','Небо не питає, чому ти мовчиш. Воно просто світить поруч.','Сьогодні ти створила маленьке диво. Хай воно побуде з тобою цієї ночі.','Навіть за хмарами сузір’я нікуди не зникають. І все добре в тобі — теж.','Кожна лінія — як подих. Повільний, теплий, твій.']},
  note:{label:'Для моєї королеви',a:'Всесвіт створив тебе із зоряного пилу та місячного світла.',b:'Моя королева. Неймовірно гарна. Завжди в моєму серці.',p:'Цей маленький світ створений для тебе, з любов’ю. З усіх зірок на небі я все одно обрав би тебе. Щоночі, знову і знову. Ти мій дім.',aria:'Ведмедик із сердечками в очах дивиться на ведмедицю, яка радісно дивиться на нього'},
  signal:{label:'Послання',h:'Скажи <em>без слів</em>',p:'Обери послання — воно відкриється на весь екран, щоб показати. Або просто скопіюй.',ph:'Ім’я (за бажанням)',show:'показати ♡',copy:'Копіювати',close:'Закрити',copied:'Скопійовано ♡',sel:'Виділено — скопіюй звідси',tipsH:'Для того, хто поруч'},
  msgs:['Мене зараз накрило. Я не злюся на тебе. Дай мені трохи часу, і я повернуся.','Я не можу зараз знайти слів, але зі мною все гаразд. Просто будь поруч, будь ласка.','Посидь зі мною тихенько? Без запитань, просто поруч.','Мені зараз потрібні обійми, а не слова.','Я поясню пізніше, коли буря вщухне. Дякую, що чекаєш на мене.','Мене щось зачепило, і я поки не знаю, як це сказати. Будь сьогодні зі мною ніжним, будь ласка.'],
  tips:['Коли людина замовкає, це тіло так захищається. Це не грубість і не про тебе.','Не питай знову і знову «що сталося?». Тиск лише сильніше заморожує.','Говори тихіше, сповільнись, сядь поруч. Твій спокій — це вже допомога.','Став прості запитання, на які можна кивнути: «Хочеш, щоб я був поруч?», «Принести води?»','Поговоріть пізніше, коли все вщухне, і тільки якщо вона захоче.'],
  later:{label:'Твій гримуар',h:'Коли буря <em>вщухла</em>',p:'Лише тоді, коли знову почуваєшся в безпеці. Кількох слів досить. Усе зберігається тільки на цьому телефоні.',newp:'Нова сторінка',q1:'Що сталося перед цим?',q2:'Чого мені тоді хотілося?',write:'Записати',past:'Попередні сторінки',ex:'Приклад',refl:'Нотатка',felt:'Відчувалося',before:'Перед цим',needed:'Мені хотілося',end:'Кожна сторінка — доказ, що ти впоралася.',empty:'Напиши хоч слово чи два',exB:'Плани раптово змінилися, а мене все питали, чому я мовчу.',exN:'Спершу побути наодинці, а потім обійми.'}
},

  aries:'Aries', ariesSub:'A word for you today', horoLabel:'Aries · today', horo:["A good day for small beginnings. One step is already a win.", "Your energy is softer today. That isn’t weakness, it’s rest.", "Someone is thinking of you warmly. More than you know.", "Today, trust your heart rather than the rush.", "The stars say: fewer “musts”, more “wants”.", "A lovely day to do something nice just for yourself.", "Your courage is quiet today. And that is enough.", "Not everything needs solving today. Some of it can wait.", "Aries shines when warm. Choose warmth.", "Today you attract kind people and good news.", "Your intuition is especially sharp today. Listen to it.", "A day for hugs, good tea and quiet.", "What worried you is slowly letting go.", "You can be gentle today, even with yourself.", "Your passion finds a good path. Hold on to the dream.", "A small joy is closer than it seems.", "The stars are on your side, even when it’s cloudy.", "A good day to say “no” to what drains you.", "Your warmth will save someone from a grey day.", "Mars helps you finish what has been waiting.", "Rest is the best gift you can give yourself today.", "Someone close really wants to see you happy.", "Your words carry power today. Speak softly.", "Slow is still forward. Don’t compare your path.", "A good day for beauty: music, a candle, your favourite dress.", "What you plant today will surely grow.", "Your strength is in calm. You will feel it today.", "The universe is preparing a sweet surprise for you.", "Today you can be happy for no reason at all.", "You are bigger than your worries. Shine today.", "The moon is with you: feelings grow clearer."],
  ariesLines:['Aries, your fire is strength. Today it can simply keep you warm instead of blazing.','Aries, you don’t have to be brave every minute. Even warriors rest.','Aries, there is no rush today. Your strength isn’t going anywhere.','Aries, your heart holds enough light for the quiet days too.','Aries, new things start with one breath. That is enough.','Aries, your passion is beautiful. So is your tenderness.','Aries, let someone hold the shield for you, even just for a minute.','Aries, you have walked through so many storms. This one will pass too.'],

  ground:{label:'Coming back to yourself',next:'Next',prev:'Back',done:'Done',again:'Again',home:'Home',
    s1:{h:'Where am I <em>now</em>?',p:'Just read it slowly.',lines:['This is today.','You are here.','You are safe.'],season:['Winter','Spring','Summer','Autumn']},
    s2:{h:'Feel the <em>ground</em>',steps:['Put your feet flat on the floor.','Press them down a little.','Feel what is holding you: the floor, the chair, the bed.','The ground is under you. It holds you.']},

  body:{label:'Body map',h:'Where does it <em>live</em> right now?',feels:'Feels like',strong:'How strong',lo:'a whisper',hi:'a storm',maybe:'Maybe it is',pick:'Pick the closest. A guess is enough.',name:'Name it, softly',nameP:'Say it in your head, like a quiet spell. A feeling with a name loses half its power.',save:'Keep in grimoire',first:'Breathe first',saved:'Written in your grimoire',
    say:(f,w)=>`“This is ${f}. I feel it ${w}. It is a visitor, not my home. It will pass.”`, inBody:'in my body', join:' and '},

  sens:{Tight:'Tight',Heavy:'Heavy',Hot:'Hot',Shaky:'Shaky',Racing:'Racing',Numb:'Numb',Empty:'Empty',Pressure:'Pressure'},

  feel:{fear:['Scared','fear'],anger:['Angry','anger'],sad:['Sad','sadness'],shame:['Ashamed','shame'],over:['Overwhelmed','overwhelm'],numb:['Frozen','freeze'],hurt:['Hurt','hurt'],alone:['Lonely','loneliness']},
  play:{label:'Gentle magic',h:'Little <em>rituals</em>',tiles:{memory:['Bear memory','Find the bear pairs'],cards:['Draw a moon card','A kind word, chosen by chance'],burn:['Burn a worry','Give it to the candle'],hearts:['Catch the hearts','Slow tapping for busy hands'],cauldron:['Stir the cauldron','Slow circles brew a potion'],candles:['Light the altar','Seven candles, seven soft words'],constel:['Constellation','Connect the stars, see what appears']}},
  cards:{label:'The moon deck',h:'Draw a <em>card</em>',p:'Not a prediction. Just a message you might need to hear today.',tap:'tap to draw',again:'Draw another'},
  deck:[['The Still Water','You went quiet because a part of you was guarding something precious. That part deserves thanks, not blame.'],['The Waning Moon','Even the moon disappears for a while, and nobody calls it broken. You are allowed your dark nights.'],['The Ember','What burns in you is not too much. It is warmth that hasn’t found a safe hearth yet.'],['The Key','You don’t owe anyone an explanation before you are ready. Words can wait. You are not late.'],['The Rose','Your thorns grew for a reason. Someone gentle will learn where to hold you.'],['The Hearthstone','Safety is built stone by stone, breath by breath. You have already laid the first one.'],['The Raven','The feeling that came today is a messenger. You can read its letter later, when your hands are steady.'],['The Tide','From inside the wave it feels endless. It isn’t. Tides always turn, and so will this.'],['The Lantern','You don’t need to see the whole path. Only enough light for the next small step.'],['The Mirror','Look at yourself the way you would look at a frightened child: softly, and with all the time in the world.'],['The Willow','Bending is not breaking. You can sway with this storm and keep every one of your roots.'],['The Silver Thread','Each time you come back to your breath, you sew yourself together a little stronger.'],['The Velvet Night','Rest is a spell too. Sometimes the bravest magic is lying down and letting the world wait for you.'],['The Crystal','Pressure shaped you, but it doesn’t own you. Underneath it all you are clear and bright.'],['The Moth','After everything, you still turn toward the light. That isn’t foolish. That is hope, and it belongs to you.'],['The Seed','Something is growing in you, quiet and underground. Don’t dig it up to check on it. Trust it.'],['The Candle','One small flame can hold back a whole room of darkness. You are more than one small flame.'],['The Cauldron','All your feelings belong in the same pot. None of them is poison. Stirred slowly, they turn into wisdom.'],['The Owl','You notice what others miss. That tenderness is a gift, even on days it feels like a wound.'],['The Hidden Star','You don’t have to shine tonight. Stars are still stars behind the clouds.'],['The Garden Gate','You decide who comes in, and when. A closed gate isn’t unkind. It is a boundary, and you are allowed one.'],['The Patient Heart','Real love can wait. It won’t drag you out of your shell. It will sit quietly beside it.'],['The Full Moon','One day the words will come back on their own, softly. Until then, your silence is still you, and still loved.'],['The Heart','You are not too much and you are not too little. You are enough, even right now, even like this.']],
  burn:{label:'Candle ritual',h:'Burn a <em>worry</em>',p:'Write a word or two, or nothing at all. The candle understands either way. Nobody else will see it.',ph:'What weighs on you… (optional)',btn:'Give it to the flame',def:'✦ ♡ ✦  this heavy thing  ✦ ♡ ✦',after:['It is smoke now. You don’t have to carry it in your hands anymore.','The flame took it. What is left is lighter, and it is still you.','Let it rise and thin out into the night. You did enough today.','Gone into the dark, like all storms eventually go.']},
  hearts:{label:'Slow game',h:'Catch the <em>hearts</em>',p:'No winning, no losing, no hurry. Tap them as they float up.',caught:'caught',words:['You caught five little sparks of kindness. Keep a few for yourself.','Your hands are calmer than they were. Your heart will follow.','Gentle is strong. You’re proving it right now.','Every heart you catch is one you deserve.','Look how soft you can be with yourself.']},
  cauldron:{label:'Cauldron',h:'Stir the <em>cauldron</em>',p:'Draw slow circles around the pot with your finger. Seven stirs and the potion is ready.',yours:'Your potion',again:'Brew another',ready:'Your potion is ready ♡'},
  potions:[['Potion of Patience','For the days when everything feels slow. It works quietly, the way roots grow in the dark.'],['Draught of Calm Waters','Three sips and the storm inside settles into ripples. Ripples are easy to hold.'],['Elixir of Self-Kindness','Tastes like warm honey and being forgiven. Take as often as needed.'],['Moonmilk Tonic','Brewed under a soft moon. It reminds your body that rest is safe and allowed.'],['Brew of Little Brave Steps','You don’t need big courage today. Just enough for the next small step. This has exactly that.'],['Tea of Letting Go','Steep, breathe, release. Whatever you are gripping can be set down for a while.'],['Rose Heart Philter','For a heart that has been guarded too long. It doesn’t force anything open. It only warms.']],
  candles:{label:'Altar',h:'Light the <em>altar</em>',p:'Tap each candle in any order. Each flame brings a word.',words:['safe','seen','soft','strong','loved','enough','home'],snuff:'Snuff gently',lines:['Seven flames, all for you. Let them hold the dark for a while.','You are every one of these words, even on the days you can’t feel it.'],light:'Light candle'},

(function sky(){
  const c=$('#sky'), x=c.getContext('2d'); let w,h,stars=[],hearts=[],cons=[],shoot=null;
  function size(){ const d=devicePixelRatio||1; w=innerWidth; h=innerHeight; c.width=w*d; c.height=h*d; x.setTransform(d,0,0,d,0,0);
    stars=Array.from({length:Math.round(w*h/5000)},()=>({x:Math.random()*w,y:Math.random()*h*.8,r:Math.random()*1.3+.3,p:Math.random()*6}));
    cons=Array.from({length:3},()=>{ const cx=Math.random()*w, cy=Math.random()*h*.6; return Array.from({length:5},()=>({x:cx+(Math.random()-.5)*140,y:cy+(Math.random()-.5)*100})); });
    hearts=Array.from({length:14},()=>({x:Math.random()*w,y:Math.random()*h,s:Math.random()*10+5,v:Math.random()*.15+.08,p:Math.random()*6})); }
  function heart(cx,cy,s,a){ x.save(); x.translate(cx,cy); x.scale(s/12,s/12); x.beginPath(); x.moveTo(0,4); x.bezierCurveTo(-8,-2,-5,-10,0,-5); x.bezierCurveTo(5,-10,8,-2,0,4); x.fillStyle=`rgba(243,166,196,${a})`; x.fill(); x.restore(); }
  function draw(t){ x.clearRect(0,0,w,h);
    for(const s of stars){ const a=.35+.45*Math.sin(t/900+s.p); x.fillStyle=`rgba(255,236,245,${RM?.6:a})`; x.beginPath(); x.arc(s.x,s.y,s.r,0,7); x.fill(); }
    x.strokeStyle='rgba(240,201,122,.16)'; x.lineWidth=.8;
    for(const cc of cons){ x.beginPath(); cc.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y)); x.stroke(); for(const p of cc){ x.fillStyle='rgba(240,201,122,.55)'; x.beginPath(); x.arc(p.x,p.y,1.6,0,7); x.fill(); } }
    if(!RM){ if(!shoot&&Math.random()<.003) shoot={x:Math.random()*w,y:Math.random()*h*.4,l:0};
      if(shoot){ shoot.l+=1; const k=shoot.l*6, g=x.createLinearGradient(shoot.x+k,shoot.y+k*.5,shoot.x+k-70,shoot.y+k*.5-35); g.addColorStop(0,'rgba(255,240,248,.9)'); g.addColorStop(1,'rgba(255,240,248,0)'); x.strokeStyle=g; x.lineWidth=1.5; x.beginPath(); x.moveTo(shoot.x+k,shoot.y+k*.5); x.lineTo(shoot.x+k-70,shoot.y+k*.5-35); x.stroke(); if(shoot.l>45) shoot=null; } }
    for(const hh of hearts){ if(!RM){ hh.y-=hh.v; if(hh.y<-20){ hh.y=h+20; hh.x=Math.random()*w; } } heart(hh.x+Math.sin(t/2000+hh.p)*8,hh.y,hh.s,.22); }
    if(!RM) requestAnimationFrame(draw); }
  size(); addEventListener('resize',()=>{ size(); if(RM) draw(0); }); RM?draw(0):requestAnimationFrame(draw);
})();

<script>
/* ===== Calm sounds, chosen in Quiet Moon Lab (Sounds tab) =====

   Open:  "Moon spell" (volume 68%, pitch -11, softness 73%, length 200%, space 11%), only for home cards and games

   Made with Web Audio (no files); starts after the first touch, follows the iPhone silent switch. */
(function(){
  let ctx=null, out=null, wet=null, dry=null, sparkle=null;

<script>
/* ===== Swipe between the five main pages: the page follows her finger with a trail of golden sparkles and a soft whoosh,
   a small moon above the menu waxes from page to page, a gold line in the menu glides along, and the first few times
   a little paw shows her she can swipe. From home, the bears run over to the new page (see the 'ev_run' story). ===== */
(function(){
  const main=document.getElementById('main'), view=document.getElementById('view'), IDS=NAV.map(n=>n[0]), RMq=matchMedia('(prefers-reduced-motion: reduce)');
  const st=document.createElement('style'); st.textContent=`
#main{touch-action:pan-y}
svg.ev-run>text,svg.ev-run>path,svg.ev-run #bsLad{display:none}
#view.sw-drag{will-change:transform,opacity}
#view.sw-anim{transition:transform var(--swd,.34s) cubic-bezier(.22,1,.36,1),opacity var(--swd,.34s) ease}
.sw-spark{position:fixed;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;pointer-events:none;z-index:30;border-radius:50%;background:radial-gradient(circle,#fffaf0 0,#f0c97a 35%,rgba(240,201,122,0) 70%);animation:swSp .75s ease-out forwards}
@keyframes swSp{from{opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}
.sw-glow{position:fixed;inset:0;pointer-events:none;z-index:29;animation:swGl .7s ease-out forwards}
@keyframes swGl{from{opacity:1}to{opacity:0}}
#navGlide{position:absolute;top:-1px;left:0;height:2px;width:20%;pointer-events:none;background:linear-gradient(90deg,rgba(240,201,122,0),var(--gold),rgba(240,201,122,0));box-shadow:0 0 10px rgba(240,201,122,.8);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
#swMoon{position:fixed;left:50%;z-index:31;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transform:translate(-50%,8px);transition:opacity .4s ease,transform .4s ease}
#swMoon.on{opacity:1;transform:translate(-50%,0)}
#swMoon svg{filter:drop-shadow(0 0 8px rgba(255,236,190,.55))}
#swMoon .dots{display:flex;gap:7px}#swMoon .dots i{width:5px;height:5px;border-radius:50%;background:rgba(240,201,122,.3);transition:background .3s,box-shadow .3s}
#swMoon .dots i.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.sw-paw{position:fixed;left:0;top:0;z-index:32;pointer-events:none;width:44px;height:44px;margin:-22px 0 0 -22px;filter:drop-shadow(0 0 10px rgba(255,190,220,.7))}
@media (prefers-reduced-motion:reduce){#view.sw-anim{transition:opacity .25s ease}.sw-spark,.sw-glow{display:none}}`;
  document.head.appendChild(st);
  // the moon: waxing crescent on the first page, full moon on the last
  const moonEl=document.createElement('div'); moonEl.id='swMoon'; moonEl.setAttribute('aria-hidden','true'); document.body.appendChild(moonEl);
  moonEl.innerHTML=`<svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="#2a1d38" stroke="rgba(240,201,122,.55)" stroke-width=".8"/><path id="swLit" fill="#fff1c2"/></svg><div class="dots">${IDS.map(()=>'<i></i>').join('')}</div>`;
  const lit=moonEl.querySelector('#swLit'), dots=[...moonEl.querySelectorAll('.dots i')];
  const phase=f=>{ const p=.2+.8*Math.max(0,Math.min(1,f/(IDS.length-1))), r=14, rx=r*Math.abs(1-2*p);
    lit.setAttribute('d',`M17 3 A${r} ${r} 0 0 1 17 31 A${rx.toFixed(2)} ${r} 0 0 ${p<.5?0:1} 17 3Z`); };
  let moonT=null;
  function moon(f){ if(!moonEl.classList.contains('on')){ const nv=document.getElementById('nav'); moonEl.style.bottom=((nv?innerHeight-nv.getBoundingClientRect().top:64)+10)+'px'; }
    phase(f); const k=Math.round(f); dots.forEach((d,i)=>d.classList.toggle('on',i===k)); moonEl.classList.add('on'); clearTimeout(moonT); }
  const moonOff=(ms=1400)=>{ clearTimeout(moonT); moonT=setTimeout(()=>moonEl.classList.remove('on'),ms); };
  // the gold line in the menu
  function glide(f,anim=true){ const nv=document.getElementById('nav'); if(!nv) return; let gl=nv.querySelector('#navGlide'); if(!gl){ gl=document.createElement('span'); gl.id='navGlide'; nv.appendChild(gl); }
    gl.style.transition=anim?'':'none'; gl.style.transform=`translateX(${(Math.max(0,Math.min(IDS.length-1,f))*100).toFixed(1)}%)`; }
  const tabIdx=()=>IDS.indexOf(TAB[current]);
  const _go=go; go=function(v){ const r=_go(v); glide(tabIdx()); return r; };
  setTimeout(()=>glide(tabIdx(),false),0);
  // sparkles
  let lastSp=0;
  function spark(x,y,n=1){ for(let j=0;j<n;j++){ const s=document.createElement('span'); s.className='sw-spark'; s.style.left=x+'px'; s.style.top=y+'px';
    s.style.setProperty('--dx',((Math.random()-.5)*50).toFixed(0)+'px'); s.style.setProperty('--dy',((Math.random()-.3)*-40).toFixed(0)+'px'); s.style.transform=`scale(${(.6+Math.random()*.8).toFixed(2)})`;
    document.body.appendChild(s); setTimeout(()=>s.remove(),800); } }
  function glow(d){ const g=document.createElement('div'); g.className='sw-glow'; g.style.background=`radial-gradient(60% 50% at ${d>0?'100%':'0%'} 60%,rgba(255,226,170,.22),rgba(255,226,170,0))`; document.body.appendChild(g); setTimeout(()=>g.remove(),750); }
  // the drag: the page follows the finger once per screen frame, nothing but a slide and a soft fade.
  // While the page moves, the bears and their 3D drawing pause (window.__qmPause) so the phone only has to slide the page.
  const idx=()=>IDS.indexOf(current), W=()=>innerWidth, pause=v=>{ window.__qmPause=v; };
  let on=false, lock=0, id=-1, sx=0, sy=0, dx=0, busy=false, dragEnd=0, raf=0, lx=0, lt=0, vel=0, px=0, py=0, unp=0;
  const ok=e=>{ if(busy||idx()<0) return false;
    if(document.querySelector('.overlay,.sheet-wrap,.showmsg')) return false;
    if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable],.bodymap,.field,.stirzone,canvas,[data-noswipe],.mm-wrap,.lang')) return false;
    return e.clientX>14&&e.clientX<innerWidth-14; };   // leave the screen edges to the phone's own gestures
  const band=v=>{ const m=W()*.14; return Math.sign(v)*m*(1-Math.exp(-Math.abs(v)/(W()*.5))); };   // soft stretch at the first and last page
  function paint(){ raf=0; const i=idx(), tg=i+(dx<0?1:-1), has=tg>=0&&tg<IDS.length, v=has?dx:band(dx), k=Math.min(1,Math.abs(v)/W());
    if(!RMq.matches) view.style.transform=`translate3d(${v.toFixed(1)}px,0,0)`; view.style.opacity=(1-k*.4).toFixed(3);
    const f=i-(has?v/W():0); glide(f,false); moon(f);
    const now=performance.now(); if(now-lastSp>80&&!RMq.matches){ lastSp=now; spark(px,py,1); } }
  main.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse'&&e.button!==0) return; if(!ok(e)) return; on=true; lock=0; id=e.pointerId; sx=lx=e.clientX; sy=e.clientY; lt=performance.now(); vel=0; dx=0; },{passive:true});
  addEventListener('pointermove',e=>{ if(!on||e.pointerId!==id) return; const mx=e.clientX-sx, my=e.clientY-sy;
    if(!lock){ if(Math.abs(mx)>7&&Math.abs(mx)>Math.abs(my)*1.15){ lock=1; clearTimeout(unp); pause(true); view.classList.remove('sw-anim'); view.classList.add('sw-drag'); } else { if(Math.abs(my)>10) on=false; return; } }
    const now=performance.now(), dt=Math.max(1,now-lt); vel=.7*((e.clientX-lx)/dt)+.3*vel; lx=e.clientX; lt=now;   // finger speed from the last moves
    dx=mx; px=e.clientX; py=e.clientY; if(!raf) raf=requestAnimationFrame(paint); },{passive:true});
  const settle=(ms=.3)=>{ view.style.setProperty('--swd',ms+'s'); view.classList.add('sw-anim'); view.style.transform=''; view.style.opacity='';
    clearTimeout(unp); unp=setTimeout(()=>{ view.classList.remove('sw-anim','sw-drag'); pause(false); },ms*1000+30); };
  function commit(i,tg,d,speed){ busy=true; if(raf){ cancelAnimationFrame(raf); raf=0; } try{ localStorage.setItem('qm-swiped','1'); }catch(_){}
    if(window.__qmWhoosh) window.__qmWhoosh();
    // the faster the flick, the quicker the page goes
    const left=W()*.5-Math.min(Math.abs(dx),W()*.5), out=Math.max(.1,Math.min(.18,left/Math.max(1,Math.abs(speed))/1000));
    view.style.setProperty('--swd',out+'s'); view.classList.add('sw-anim');
    if(!RMq.matches) view.style.transform=`translate3d(${(-d*W()*.5).toFixed(0)}px,0,0)`; view.style.opacity='0';
    glide(tg); moon(tg);
    setTimeout(()=>{ view.classList.remove('sw-anim'); go(IDS[tg]); if(!RMq.matches) view.style.transform=`translate3d(${(d*W()*.18).toFixed(0)}px,0,0)`; view.style.opacity='0';
      // let the new page finish building for one frame, then glide it in
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ settle(.3); if(!RMq.matches){ glow(d); for(let j=0;j<6;j++) setTimeout(()=>spark(d>0?W()*(.55+Math.random()*.4):W()*(.05+Math.random()*.4),innerHeight*(.25+Math.random()*.5),1),j*40); }
        moonOff(); setTimeout(()=>{ busy=false; },320); })); },out*1000); }
  function end(e){ if(!on||e.pointerId!==id) return; on=false; if(!lock) return; dragEnd=performance.now(); if(performance.now()-lt>90) vel=0;   // a pause before letting go is not a flick
    const i=idx(), d=dx<0?1:-1, tg=i+d, flick=Math.abs(vel)>.3&&Math.sign(vel)===-d;
    if(tg>=0&&tg<IDS.length&&(Math.abs(dx)>W()*.18||(flick&&Math.abs(dx)>24))) commit(i,tg,d,vel); else { if(raf){ cancelAnimationFrame(raf); raf=0; } settle(.3); glide(i); moonOff(500); } }
  addEventListener('pointerup',end,{passive:true});
  addEventListener('pointercancel',e=>{ if(on&&e.pointerId===id){ on=false; if(lock){ if(raf){ cancelAnimationFrame(raf); raf=0; } settle(); glide(idx()); moonOff(500); } } },{passive:true});
  // a swipe must not also open the card it started on
  addEventListener('click',e=>{ if(performance.now()-dragEnd<450){ e.stopPropagation(); e.preventDefault(); } },true);
  // the paw: the first few times she is on the home page, until she has swiped once
  const PAW='<svg viewBox="0 0 44 44" width="44" height="44"><g fill="#f7b6cf" stroke="#f0c97a" stroke-width="1"><ellipse cx="22" cy="28" rx="10" ry="8.5"/><ellipse cx="10.5" cy="17" rx="4" ry="5"/><ellipse cx="18" cy="11.5" rx="4" ry="5.2"/><ellipse cx="26" cy="11.5" rx="4" ry="5.2"/><ellipse cx="33.5" cy="17" rx="4" ry="5"/></g></svg>';
  function paw(){ let n=0, done=false; try{ done=!!localStorage.getItem('qm-swiped'); n=+(localStorage.getItem('qm-paw')||0); }catch(_){}
    if(done||n>=3||RMq.matches) return; try{ localStorage.setItem('qm-paw',String(n+1)); }catch(_){}
    const p=document.createElement('div'); p.className='sw-paw'; p.innerHTML=PAW; document.body.appendChild(p);
    const y=innerHeight*.5, x0=innerWidth*.78, x1=innerWidth*.22, T=1300, start=performance.now(); let k=0;
    (function step(now){ if(!p.isConnected) return; const t=(now-start)/T, r=Math.floor(t), u=t-r; if(r>=2||current!=='now'){ p.remove(); return; }
      const e=u<.15?0:u>.85?1:(u-.15)/.7, ee=e<.5?2*e*e:1-Math.pow(-2*e+2,2)/2, x=x0+(x1-x0)*ee, a=u<.15?u/.15:u>.85?(1-u)/.15:1;
      p.style.transform=`translate(${x.toFixed(0)}px,${(y+Math.sin(ee*Math.PI)*-10).toFixed(0)}px) rotate(-15deg)`; p.style.opacity=a.toFixed(2);
      if(e>0&&e<1&&++k%3===0) spark(x,y+8,1); requestAnimationFrame(step); })(start); }
  setTimeout(()=>{ if(current==='now'&&!(window.__evOn&&window.__evOn())) paw(); },3200);
})();
</script>
